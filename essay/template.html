<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--paper:#070707;--ink:#e9e8e4;--soft:#8d8c88;--line:#1f1f1f;--bar:64px;--strip:58px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:400 17px/1.75 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;overflow:hidden}
#ocean{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--bar) - var(--strip));border:0;display:block;will-change:transform}
/* the deep: darkness gathers from below as you go down */
#abyss{position:fixed;inset:0;pointer-events:none;opacity:0;will-change:opacity;background:linear-gradient(180deg,rgba(4,22,34,.35) 0%,rgba(3,18,30,.85) 45%,#03121e 80%)}

/* the drawer: closed, only its bar and the black strip show at the bottom; open, it fills the screen */
/* the drawer is moved by a spring on the compositor (transform only): no layout work while it travels */
#drawer{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:var(--paper);
  transform:translate3d(0,calc(100% - var(--bar) - var(--strip)),0);will-change:transform;z-index:2;
  box-shadow:0 -1px 0 var(--line),0 -18px 40px rgba(0,0,0,0);contain:layout paint}
#veil{position:fixed;inset:0;background:#06141a;opacity:0;pointer-events:none;z-index:1;will-change:opacity}
#read .layout{will-change:transform,opacity}
#bar{flex:none;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;
  background:var(--paper);border-top:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#bar:active{cursor:grabbing}
#bar .label{transition:opacity .25s ease}
#bar .handle i{transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s}
#drawer.open #bar .handle i:nth-child(1){transform:translateY(2px)}#drawer.open #bar .handle i:nth-child(3){transform:translateY(-2px)}
#bar .label{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
#bar .handle{width:60px;height:24px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0}
#bar .handle i{display:block;height:1.5px;background:#d8d7d3}
#bar:hover .label,#bar:focus-visible .label{color:#fff}
#bar:focus-visible{outline:1px solid #fff;outline-offset:-4px}
#strip{flex:none;height:var(--strip);background:#000;border-top:1px solid #161616;border-bottom:1px solid #161616;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;letter-spacing:.02em}
#strip img{height:22px;width:auto;display:block}
#strip img.esbi{height:34px}

#read:focus{outline:none}
#read{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
#wb{position:sticky;top:18px;float:right;margin:18px 24px 0 0;z-index:3;display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 18px;background:rgba(10,10,10,.7);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2e2e2e;border-radius:999px;color:#e9e8e4;text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  transition:border-color .3s,background .3s,color .3s}
#wb:hover,#wb:focus-visible{border-color:#e9e8e4;background:#e9e8e4;color:#000}
.layout{display:grid;grid-template-columns:minmax(200px,clamp(220px,20vw,320px)) minmax(0,46rem);gap:0 clamp(32px,6vw,120px);padding:clamp(28px,4vw,64px) clamp(20px,5vw,96px) 30vh clamp(20px,7vw,140px)}
/* contents: a quiet index that reads like an instrument */
nav#sections{position:sticky;top:46px;align-self:start;padding:4px 0 0 0}
nav#sections .cap{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 22px;padding-left:22px;
  font:500 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:#5d5c59}
nav#sections .cap b{font-weight:500;color:#9a9995}
nav#sections .track{position:absolute;left:0;top:37px;bottom:0;width:1px;background:linear-gradient(#262626,#262626 85%,transparent)}
#ind{position:absolute;left:-1px;top:0;width:3px;background:#f2f1ed;border-radius:2px;box-shadow:0 0 14px rgba(242,241,237,.45);transform-origin:0 0;will-change:transform;
  transition:transform .6s cubic-bezier(.22,1,.36,1),height .6s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:1}
nav#sections a{position:relative;display:grid;grid-template-columns:30px 1fr;align-items:baseline;padding:13px 0 15px 22px;color:#6f6e6a;text-decoration:none;
  font-size:clamp(15px,.35vw + 13px,17px);line-height:1.3;letter-spacing:-.005em;transition:color .45s ease}
nav#sections a .n{font:500 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.08em;color:#4a4946;transition:color .45s}
nav#sections a .t{display:block;transition:transform .55s cubic-bezier(.22,1,.36,1)}
nav#sections a::after{content:"";position:absolute;left:52px;right:0;bottom:6px;height:1px;background:#f2f1ed;transform:scaleX(var(--p,0));transform-origin:0 50%;opacity:0;transition:opacity .4s}
nav#sections a:hover{color:#d6d5d1}
nav#sections a:hover .t{transform:translateX(5px)}
nav#sections a.on{color:#fff}
nav#sections a.on .n{color:#f2f1ed}
nav#sections a.on::after{opacity:.55}
article h1.wm{margin:0 0 clamp(32px,4vw,64px);line-height:0}
article h1.wm img{display:block;width:min(100%,560px);height:auto;filter:invert(1)}
article h1{font-weight:400;font-size:clamp(34px,2.6vw + 14px,56px);line-height:1.08;margin:0 0 clamp(32px,4vw,64px);letter-spacing:-.015em}
article section{scroll-margin-top:40px}
article h2{font-weight:400;font-size:clamp(23px,1.2vw + 16px,32px);line-height:1.25;margin:clamp(56px,6vw,96px) 0 clamp(18px,2vw,28px)}
article section:first-of-type h2{margin-top:0}
article h3{font-weight:400;font-size:clamp(14px,.3vw + 12px,16px);letter-spacing:.06em;text-transform:uppercase;color:#8d8c88;margin:46px 0 16px}
article ::selection{background:#e9e8e4;color:#000}
article h2{color:#fff}
article p{color:#d9d8d4;margin:0 0 1.35em;font-size:clamp(17px,.45vw + 14px,21px);line-height:1.8;max-width:42em;hanging-punctuation:first}
article p.labeled b{font-weight:600}
#menu{display:none}

@media (max-width:820px){
  :root{--bar:58px;--strip:46px}
  #bar{padding:0 16px}#bar .label{font-size:13px}
  #strip img{height:16px}#strip img.esbi{height:28px}
  .layout{display:block}
  nav#sections{display:none}
  #menu{display:block;position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:28px}
  #menu select{font:inherit;font-size:16px;width:100%;padding:8px;border:1px solid #333;background:#111;color:#e9e8e4;border-radius:3px}
  #wb{position:static;float:none;display:block;margin:14px 22px 0;text-align:center}
}
@media (prefers-reduced-motion:reduce){#ind,nav#sections a{transition:none}}
</style>
</head>
<body>
<iframe id="ocean" src="../projector/v28/?embed=1&b=3" title="The water, made of the Black Aquatics archive, with the Kongo cosmogram standing in it" allow="fullscreen"></iframe>

<div id="abyss" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>
<div id="drawer" aria-label="Essay drawer">
  <div id="bar" role="button" tabindex="0" aria-expanded="false" aria-controls="read">
    <span class="label" id="barLabel">Read the essay</span>
    <span class="handle" aria-hidden="true"><i></i><i></i><i></i></span>
    <span></span>
  </div>
  <div id="strip">
    <img class="esbi" src="esbi.png" alt="Experimental School for Black Imagination">
    <img src="logo.png" alt="Black Aquatics">
  </div>
  <div id="read" tabindex="-1">
    <a id="wb" href="../workbench/">Workbench &rsaquo;</a>
    <div class="layout">
      <nav id="sections" aria-label="Essay sections"><div class="cap"><span>Contents</span><b id="secCount"></b></div><span class="track" aria-hidden="true"></span><span id="ind" aria-hidden="true"></span>
{{NAV}}
      </nav>
      <article>
        <div id="menu"><label class="sr" for="jump" style="position:absolute;left:-9999px">Go to section</label><select id="jump"></select></div>
        <h1 class="wm"><img src="wordmark.png" alt="{{TITLE}}"></h1>
{{BODY}}
      </article>
    </div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const abyss=$('#abyss'),drawer=$('#drawer'),bar=$('#bar'),read=$('#read'),ocean=$('#ocean'),veil=$('#veil'),layout=read.querySelector('.layout'),ind=$('#ind');
const secs=[...document.querySelectorAll('article section')];
const links=[...document.querySelectorAll('nav#sections a')];
const jump=$('#jump');
secs.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.dataset.title;jump.appendChild(o);});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
links.forEach((a,i)=>{a.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${a.textContent}</span>`;});
document.getElementById('secCount').textContent=String(links.length).padStart(2,'0');
let pRaf=0;read.addEventListener('scroll',()=>{if(pRaf)return;pRaf=requestAnimationFrame(()=>{pRaf=0;
  const R=read.getBoundingClientRect(),mid=R.top+R.height*.35;
  secs.forEach((s,i)=>{const r=s.getBoundingClientRect();const p=Math.max(0,Math.min(1,(mid-r.top)/Math.max(1,r.height)));links[i]&&links[i].style.setProperty('--p',p.toFixed(3));});});},{passive:true});

// ---------- the drawer: one spring, driven by the frame clock, on transform only ----------
// p = how far open (0 closed, 1 open). Clicks set a target; drags move p directly and fling on release.
let p=0,v=0,target=0,raf=0,dragging=false,last=0;
const closedY=()=>drawer.offsetHeight-bar.offsetHeight-$('#strip').offsetHeight;
function paint(){
  const y=(1-p)*closedY();
  drawer.style.transform=`translate3d(0,${y.toFixed(2)}px,0)`;
  veil.style.opacity=(Math.max(0,Math.min(1,p))*.25).toFixed(3);
  // parallax: the water rises faster than the drawer, and the camera sinks, so pulling up reads as going down
  const c=Math.max(0,Math.min(1,p));
  ocean.style.transform=`translate3d(0,${(-c*closedY()*.6).toFixed(1)}px,0)`;
  abyss.style.opacity=Math.min(1,c*1.1).toFixed(3);
  // the reading room starts deep blue and goes to black as it rises into place
  const bl=Math.min(1,Math.max(0,(c-.15)/.85)),mix=(a,b)=>Math.round(a+(b-a)*bl);
  read.style.background=`linear-gradient(180deg, rgb(${mix(8,7)},${mix(30,7)},${mix(46,7)}) 0%, rgb(${mix(4,7)},${mix(16,7)},${mix(26,7)}) 55%, #070707 100%)`;
  if(Math.abs(c-(paint.lastDive??-1))>.002){paint.lastDive=c;try{ocean.contentWindow.postMessage({ba:'dive',d:c},'*');}catch(e){}}
  // the essay rises into place a beat behind the drawer
  const q=Math.max(0,Math.min(1,(p-.35)/.65));const e=1-Math.pow(1-q,3);
  layout.style.opacity=e.toFixed(3);layout.style.transform=`translate3d(0,${((1-e)*28).toFixed(2)}px,0)`;
}
function tick(now){
  const dt=Math.min(.032,(now-(last||now))/1000)||.016;last=now;
  if(!dragging){
    // a gently damped spring: quick to leave, soft to land, no bounce
    const k=reduce?400:150,c=reduce?40:2*Math.sqrt(150)*1.02;
    const a=k*(target-p)-c*v;v+=a*dt;p+=v*dt;
    if(Math.abs(target-p)<.0008&&Math.abs(v)<.002){p=target;v=0;paint();settle();raf=0;last=0;return;}
  }
  paint();raf=requestAnimationFrame(tick);
}
function run(){ocean.style.visibility='visible';if(!raf){last=0;raf=requestAnimationFrame(tick);}oceanRest(false);}
// the ocean slows while the drawer travels and rests while it covers the water, so the motion never fights the GPU
function oceanRest(full){try{ocean.contentWindow.postMessage({ba:'ocean',state:full?'rest':(p>.02||target>0)?'slow':'live'},'*');}catch(e){}}
function settle(){
  const open=target>.5;
  drawer.classList.toggle('open',open);bar.setAttribute('aria-expanded',open);
  $('#barLabel').textContent=open?'Back to the water':'Read the essay';
  ocean.style.visibility=open?'hidden':'visible';oceanRest(open);
  if(!open)try{ocean.contentWindow.postMessage({ba:'ocean',state:'live'},'*');}catch(e){}
  if(open)read.focus({preventScroll:true});
}
function setOpen(open,{fromHash=false,instant=false}={}){
  target=open?1:0;ocean.style.visibility='visible';
  $('#barLabel').style.opacity=0;setTimeout(()=>{$('#barLabel').textContent=open?'Back to the water':'Read the essay';$('#barLabel').style.opacity=1;},180);
  if(!open&&!fromHash&&location.hash)history.pushState(null,'',location.pathname+location.search);
  if(instant){p=target;v=0;paint();settle();return;}
  run();
}
// drag the bar: it follows the hand exactly, then a flick decides
let sy=0,sp=0,moved=0,lastY=0,lastT=0,vel=0;
bar.addEventListener('pointerdown',e=>{dragging=true;moved=0;sy=lastY=e.clientY;lastT=performance.now();sp=p;vel=0;bar.setPointerCapture(e.pointerId);run();});
bar.addEventListener('pointermove',e=>{if(!dragging)return;const H=closedY();moved=Math.max(moved,Math.abs(e.clientY-sy));
  const now=performance.now();vel=((lastY-e.clientY)/H)/Math.max(.008,(now-lastT)/1000)*.6+vel*.4;lastY=e.clientY;lastT=now;
  let np=sp+(sy-e.clientY)/H;if(np<0)np*=.3;if(np>1)np=1+(np-1)*.3;p=np;v=0;});
function endDrag(e){if(!dragging)return;dragging=false;
  if(moved<6){setOpen(target<.5);return;}            // a click
  v=vel;target=(p+vel*.18)>.5?1:0;                   // a flick or a drop
  if(target===0&&location.hash)history.pushState(null,'',location.pathname+location.search);
  $('#barLabel').textContent=target?'Back to the water':'Read the essay';
  run();}
bar.addEventListener('pointerup',endDrag);bar.addEventListener('pointercancel',endDrag);
bar.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(target<.5);}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&target>.5)setOpen(false);});
addEventListener('resize',()=>{paint();placeInd(curId,true);});

// ---------- reading: eased scrolling, a sliding marker, the address in step ----------
let curId=secs[0].id,anim=null;
function placeInd(id,instant){const a=links.find(l=>l.dataset.s===id);if(!a||!ind)return;
  if(instant)ind.style.transition='none';
  ind.style.height=a.offsetHeight+'px';ind.style.transform=`translate3d(0,${a.offsetTop}px,0)`;
  if(instant){ind.offsetHeight;ind.style.transition='';}}
function setCur(id){if(id===curId)return;curId=id;links.forEach(a=>a.classList.toggle('on',a.dataset.s===id));jump.value=id;placeInd(id);
  if(target>.5&&location.hash!=='#'+id)history.replaceState(null,'','#'+id);}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function scrollToY(y){
  cancelAnimationFrame(anim&&anim.raf);const y0=read.scrollTop,d=y-y0;if(Math.abs(d)<2){read.scrollTop=y;return;}
  const dur=reduce?0:Math.min(1100,Math.max(520,Math.sqrt(Math.abs(d))*14)),t0=performance.now();
  anim={raf:0};const step=now=>{const t=dur?Math.min(1,(now-t0)/dur):1;read.scrollTop=y0+d*ease(t);if(t<1)anim.raf=requestAnimationFrame(step);else anim=null;};
  anim.raf=requestAnimationFrame(step);}
['wheel','touchstart','keydown'].forEach(ev=>read.addEventListener(ev,()=>{if(anim){cancelAnimationFrame(anim.raf);anim=null;}},{passive:true}));
function goTo(id,push=true){
  const el=document.getElementById(id);if(!el)return;
  const y=el.offsetTop-30;
  if(target<.5){setOpen(true,{fromHash:true});read.scrollTop=y;}else scrollToY(y);
  links.forEach(a=>a.classList.toggle('on',a.dataset.s===id));curId=id;jump.value=id;placeInd(id);
  if(push&&location.hash!=='#'+id)history.pushState(null,'','#'+id);
}
links.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goTo(a.dataset.s);}));
jump.addEventListener('change',()=>goTo(jump.value));
// which section is being read: the browser reports crossings, nothing runs on every scroll frame
const io=new IntersectionObserver(es=>{if(anim)return;
  const vis=secs.filter(s=>{const r=s.getBoundingClientRect(),R=read.getBoundingClientRect();return r.top<R.top+R.height*.35&&r.bottom>R.top+R.height*.35;});
  if(vis[0])setCur(vis[0].id);},{root:read,rootMargin:'-35% 0px -64% 0px',threshold:0});
secs.forEach(s=>io.observe(s));

function fromUrl(){const id=location.hash.slice(1);
  if(id&&document.getElementById(id)){setOpen(true,{fromHash:true,instant:!raf&&p===0&&!fromUrl.ran});const el=document.getElementById(id);read.scrollTop=el.offsetTop-30;curId='';setCur(id);}
  else if(!id&&target>.5)setOpen(false,{fromHash:true});
  fromUrl.ran=true;}
addEventListener('popstate',fromUrl);
paint();placeInd(curId,true);links[0]&&links[0].classList.add('on');
fromUrl();
})();
</script>
</body>
</html>
