<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Aquatics · Sorting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #0b1f2a; --deep2: #10303f; --ink: #e9f1f2; --mute: #8fb0b8;
    --line: #1f4757; --keep: #3fb68b; --nix: #d9674e; --gold: #e2b65c;
    --card: #12303e; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 700px at 70% -10%, #17465a 0%, var(--deep) 60%); color: var(--ink);
         font: 15px/1.5 Inter, system-ui, sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 18px; padding: 16px 24px; border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: rgba(11,31,42,.92); backdrop-filter: blur(8px); z-index: 5; flex-wrap: wrap; }
  h1 { font: 600 20px/1 Fraunces, serif; margin: 0; letter-spacing: .2px; }
  h1 small { font: 400 12px Inter; color: var(--mute); margin-left: 8px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: transparent; border: 1px solid transparent; color: var(--mute); padding: 7px 12px; border-radius: 999px;
               font: 500 14px Inter; cursor: pointer; }
  nav button.on { color: var(--ink); border-color: var(--line); background: var(--deep2); }
  nav .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #0d2633;
           font-size: 12px; color: var(--ink); }
  .status { margin-left: auto; color: var(--mute); font-size: 13px; display: flex; gap: 12px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); display: inline-block; }
  .dot.live { background: var(--keep); box-shadow: 0 0 0 4px rgba(63,182,139,.18); }
  .linkbtn { background: none; border: 0; color: var(--mute); text-decoration: underline; cursor: pointer; font: inherit; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; color: var(--mute); font-size: 13px; }
  select, input[type=text], input[type=password] { background: var(--deep2); color: var(--ink); border: 1px solid var(--line);
           border-radius: 8px; padding: 7px 10px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex;
          flex-direction: column; position: relative; }
  .tile.keep { outline: 2px solid var(--keep); } .tile.nix { opacity: .55; }
  .thumb { aspect-ratio: 4/3; background: #0a1a22; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .noimg { color: var(--mute); font-size: 12px; padding: 16px; text-align: center; }
  .care { background: repeating-linear-gradient(45deg, #2a2216, #2a2216 10px, #241d13 10px, #241d13 20px); color: var(--gold); }
  /* care-flagged previews: blurred image with the note on top; click to reveal */
  .veiled { position: relative; }
  .veiled img { filter: blur(18px) saturate(.6) brightness(.7); transform: scale(1.08); }
  .veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
          padding: 14px; text-align: center; color: var(--gold); font-size: 12px; line-height: 1.4; background: rgba(20,16,10,.35); cursor: pointer; }
  .veil b { font: 600 12px Inter; letter-spacing: .4px; text-transform: uppercase; }
  .veil .rv { border: 1px solid var(--gold); border-radius: 999px; padding: 3px 12px; font-size: 12px; }
  .revealed img { filter: none; transform: none; } .revealed .veil { display: none; }
  .cflag { position: absolute; bottom: 8px; left: 8px; background: rgba(42,34,22,.9); color: var(--gold); border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  /* text cards for finds with no picture (passages, documents, blocked images) */
  .textcard { width: 100%; height: 100%; background: #efe6d2; color: #2a2116; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
              overflow: hidden; font: 13px/1.45 Georgia, serif; text-align: left; cursor: default; }
  .textcard .kd { font: 600 10px Inter; letter-spacing: .6px; text-transform: uppercase; color: #7a5d2e; }
  .textcard q { quotes: "\201C" "\201D"; font-style: italic; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
  .textcard .by { margin-top: auto; font: 12px Inter; color: #6b5a3e; }
  .card .textcard { max-width: 640px; height: auto; max-height: 90%; border-radius: 12px; font-size: 16px; padding: 28px 32px; }
  .card .textcard q { -webkit-line-clamp: 18; }
  .card.veiled img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .t { font: 600 14px/1.3 Inter; }
  .sub { color: var(--mute); font-size: 12px; }
  .acts { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
  .acts button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px;
                 cursor: pointer; font: 500 13px Inter; }
  .acts .k:hover, .acts .k.on { background: var(--keep); border-color: var(--keep); color: #06231a; }
  .acts .x:hover, .acts .x.on { background: var(--nix); border-color: var(--nix); color: #2a0d06; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(11,31,42,.85); border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .new { background: var(--gold); color: #2b1f05; }
  /* swipe */
  .swipe { display: grid; grid-template-columns: 1fr minmax(320px, 420px); gap: 28px; align-items: start; }
  .stage { position: relative; height: calc(100vh - 210px); min-height: 420px; display: flex; align-items: center; justify-content: center; }
  .card { position: absolute; inset: 0; background: #071820; border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
          display: flex; align-items: center; justify-content: center; transition: transform .28s ease, opacity .28s ease; touch-action: pan-y; }
  .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card.goR { transform: translateX(60%) rotate(8deg); opacity: 0; }
  .card.goL { transform: translateX(-60%) rotate(-8deg); opacity: 0; }
  .stamp { position: absolute; top: 24px; font: 600 28px Fraunces; padding: 4px 14px; border: 3px solid; border-radius: 10px; opacity: 0; transition: opacity .15s; }
  .stamp.k { left: 24px; color: var(--keep); } .stamp.x { right: 24px; color: var(--nix); }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .info h2 { font: 600 22px/1.25 Fraunces, serif; margin: 0; }
  .row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; font-size: 13px; }
  .row b { color: var(--mute); font-weight: 500; }
  .big { display: flex; gap: 10px; margin-top: 6px; }
  .big button { flex: 1; padding: 14px; border-radius: 12px; border: 0; font: 600 16px Inter; cursor: pointer; }
  .big .x { background: var(--nix); color: #2a0d06; } .big .k { background: var(--keep); color: #06231a; }
  .big .u { flex: 0 0 auto; background: var(--deep2); color: var(--ink); border: 1px solid var(--line); }
  .keys { color: var(--mute); font-size: 12px; }
  .links a { color: var(--ink); margin-right: 12px; font-size: 13px; }
  .empty { color: var(--mute); text-align: center; padding: 80px 20px; }
  .reflect { max-width: 820px; margin: 0 auto; font: 16px/1.7 Fraunces, serif; }
  .reflect h2 { font: 600 15px Inter; color: var(--gold); margin: 34px 0 8px; letter-spacing: .3px; }
  .reflect p { margin: 0 0 12px; }
  .setup { max-width: 560px; margin: 60px auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
  .setup h2 { font: 600 22px Fraunces; margin: 0 0 8px; }
  .setup label { display: block; margin: 14px 0 6px; color: var(--mute); font-size: 13px; }
  .setup input { width: 100%; }
  .setup ol { color: var(--mute); font-size: 13px; padding-left: 18px; }
  .primary { margin-top: 18px; background: var(--keep); color: #06231a; border: 0; border-radius: 10px; padding: 11px 18px; font: 600 15px Inter; cursor: pointer; }
  .lightbox { position: fixed; inset: 0; background: rgba(3,10,14,.94); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  .lightbox img { max-width: 94vw; max-height: 94vh; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--deep2); border: 1px solid var(--line);
           padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; z-index: 30; }
  .act { display: grid; grid-template-columns: 340px 1fr; gap: 22px; align-items: start; }
  .staff { display: flex; flex-direction: column; gap: 12px; }
  .agent { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .agent h3 { margin: 0 0 2px; font: 600 15px Inter; display: flex; align-items: center; gap: 8px; }
  .agent .role { color: var(--mute); font-size: 12px; margin-bottom: 8px; }
  .pill { font: 600 11px Inter; padding: 2px 8px; border-radius: 999px; background: #0d2633; color: var(--mute); margin-left: auto; }
  .pill.run { background: var(--gold); color: #2b1f05; animation: pulse 1.4s infinite; }
  .pill.ok { background: rgba(63,182,139,.2); color: var(--keep); } .pill.bad { background: rgba(217,103,78,.2); color: var(--nix); }
  @keyframes pulse { 50% { opacity: .55; } }
  .feed { background: #071820; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
          font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: calc(100vh - 170px); overflow: auto; }
  .feed .ln { padding: 3px 0; border-bottom: 1px dashed #12313f; display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
  .feed .tm { color: var(--mute); } .feed .g { color: var(--keep); } .feed .r { color: var(--nix); } .feed .y { color: var(--gold); }
  .feed h4 { font: 600 12px Inter; color: var(--gold); margin: 16px 0 6px; letter-spacing: .4px; text-transform: uppercase; }
  .feed pre { white-space: pre-wrap; margin: 0; color: #cfe0e3; }
  .banner { background: rgba(217,103,78,.14); border: 1px solid var(--nix); color: #f3c3b6; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  @media (max-width: 860px) { .act { grid-template-columns: 1fr; } }
  @media (max-width: 860px) { .swipe { grid-template-columns: 1fr; } .stage { height: 60vh; } main { padding: 14px; } }

  /* image-first layout */
  main { max-width: 1800px; padding: 18px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .thumb { aspect-ratio: auto; height: 380px; background: #050f14; }
  .thumb img { object-fit: contain; }
  .thumb .textcard { height: 100%; }
  .tile .meta { padding: 8px 12px 10px; gap: 2px; }
  .tile .t { font: 600 13px/1.3 Inter; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more summary { cursor: pointer; color: var(--mute); font-size: 12px; margin-top: 2px; }
  .more[open] { display: flex; flex-direction: column; gap: 4px; }
  .acts.over { position: absolute; top: 330px; right: 10px; padding: 0; margin: 0; gap: 8px; z-index: 2; }
  .acts.over button { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; padding: 0; font: 600 17px Inter;
                      background: rgba(5,15,20,.78); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(4px); }
  .tile .badge { z-index: 2; }
  .thumb { position: relative; }
  .zoom { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
          background: rgba(5,15,20,.78); color: var(--ink); font-size: 15px; cursor: zoom-in; z-index: 2; }
  /* swipe: image takes almost the whole screen, details in a slim scrolling column */
  .swipe { grid-template-columns: 1fr minmax(260px, 320px); gap: 16px; }
  .stage { height: calc(100vh - 130px); }
  .card { background: #050f14; }
  .info { max-height: calc(100vh - 130px); overflow: auto; padding: 14px; gap: 8px; }
  .info h2 { font-size: 17px; }
  .row { grid-template-columns: 70px 1fr; font-size: 12px; }
  .big button { padding: 11px; font-size: 15px; }
  .info > .sub:first-child, .info > h2 { order: -2; } .info > .big { order: -1; margin: 2px 0 6px; }
  @media (max-width: 800px) { .swipe { grid-template-columns: 1fr; } .stage { height: 70vh; } .info { max-height: none; } .thumb { height: 300px; } .acts.over { top: 250px; } }

  /* v4 library intake */
  .ibar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--mute); font-size: 13px; }
  .ibar select, .ibar input { min-width: 220px; }
  .ibar .stat b { color: var(--ink); }
  .itile.go { outline: 3px solid var(--keep); }
  .itile .gobadge { position: absolute; top: 8px; left: 8px; z-index: 2; border-radius: 999px; padding: 2px 9px; font: 600 11px Inter;
                    background: rgba(42,22,16,.85); color: #f0b9a8; }
  .itile.go .gobadge { background: var(--keep); color: #06231a; }
  .itile .codes { display: flex; gap: 4px; flex-wrap: wrap; }
  .itile .codes span { font-size: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; color: var(--gold); }
.held{font-size:12px;color:#e9b872;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Black Aquatics <small>Sorting Room</small></h1>
  <nav id="tabs">
    <button data-tab="all">All <span class="n" id="n-all">0</span></button>
    <button data-tab="swipe">Swipe <span class="n" id="n-swipe">0</span></button>
    <button data-tab="keep">Advancing <span class="n" id="n-keep">0</span></button>
    <button data-tab="nix">Nixed <span class="n" id="n-nix">0</span></button>
    <button data-tab="intake">v4 Library <span class="n" id="n-intake">·</span></button>
    <button data-tab="reflect">Reflections</button>
  </nav>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">Not connected</span>
    <button class="linkbtn" id="v4live" title="When on, Refresh also publishes your gos to the v4 library"></button><button class="linkbtn" id="refresh">Refresh</button><button class="linkbtn" id="settings">Settings</button></div>
</header>
<main id="main"></main>
<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const DEF_REPO = "zellaships/black-aquatics-research";
  const POLL_MS = 60000;
  const S = {
    get(k, d) { try { const v = localStorage.getItem("ba." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ba." + k, JSON.stringify(v)); } catch {} }
  };
  let token = S.get("token", ""), repo = S.get("repo", DEF_REPO);
  let records = {};            // id -> {rec, path}
  let cache = S.get("cache", {}); // path -> record (records never change once written)
  let sort = {};               // id -> {status, at}
  let sortSha = null, pending = {}, saveTimer = null;
  let keptFolders = new Set();
  let seenIds = new Set(S.get("seen", []));
  let tab = (location.hash || "#all").slice(1);
  let filter = { lane: "", day: "" };
  let history = [];            // undo stack for swipe
  let reflections = "";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2200); }

  async function api(path, opts = {}) {
    const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
      ...opts, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) }
    });
    if (!res.ok && res.status !== 404) throw new Error(`${res.status} ${res.statusText}`);
    return res;
  }
  async function raw(path) {
    const r = await api(`/contents/${encodeURI(path)}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } });
    return r.status === 404 ? null : r.text();
  }
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));

  async function load() {
    if (!token) { renderSetup(); return; }
    $("#stat").textContent = "Syncing...";
    try {
      const tree = await (await api(`/git/trees/main?recursive=1`)).json();
      const paths = (tree.tree || []).map(t => t.path);
      const recPaths = paths.filter(p => /^inbox\/[^/]+\/[^/]+\/find-[^/]+\.json$/.test(p));
      keptFolders = new Set(paths.filter(p => /^kept\/[^/]+\/[^/]+\.(jpe?g|png|tiff?|gif|webp|bin|jp2)$/i.test(p)).map(p => p.split("/")[1]));
      const missing = recPaths.filter(p => !cache[p]);
      for (let i = 0; i < missing.length; i += 8) {
        await Promise.all(missing.slice(i, i + 8).map(async p => {
          try { const txt = await raw(p); if (txt) cache[p] = JSON.parse(txt); } catch (e) { console.warn(p, e); }
        }));
      }
      S.set("cache", cache);
      records = {};
      for (const p of recPaths) if (cache[p]) { const r = cache[p]; const id = r.id || p.split("/").pop().slice(0, -5); records[id] = { rec: r, path: p }; }
      const sr = await api(`/contents/decisions/sort.json?ref=main`);
      if (sr.status !== 404) { const j = await sr.json(); sortSha = j.sha; try { sort = JSON.parse(unb64(j.content)); } catch { sort = {}; } }
      Object.assign(sort, pending);
      reflections = (await raw("journal/reflections.md")) || "";
      $("#dot").className = "dot live";
      $("#stat").textContent = `Live · synced ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      render();
    } catch (e) {
      $("#dot").className = "dot";
      $("#stat").textContent = `Sync failed (${e.message})`;
      if (/401|403/.test(e.message)) renderSetup("GitHub refused the token. Check that it has Contents read and write access to the repo.");
    }
  }

  function statusOf(id) { return (sort[id] || {}).status || ""; }
  function setStatus(id, status) {
    const prev = statusOf(id);
    if (status) { sort[id] = { status, at: new Date().toISOString() }; pending[id] = sort[id]; }
    else { delete sort[id]; pending[id] = null; }
    seenIds.add(id); S.set("seen", [...seenIds]);
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 2500);
    counts();
    return prev;
  }
  async function save() {
    const changes = pending; pending = {};
    if (!Object.keys(changes).length) return;
    try {
      const cur = await api(`/contents/decisions/sort.json?ref=main`);
      let base = {}, sha;
      if (cur.status !== 404) { const j = await cur.json(); sha = j.sha; try { base = JSON.parse(unb64(j.content)); } catch {} }
      for (const [id, v] of Object.entries(changes)) { if (v) base[id] = v; else delete base[id]; }
      const body = { message: `Sort: ${Object.keys(changes).length} decisions`, content: b64(JSON.stringify(base, null, 1) + "\n"), branch: "main" };
      if (sha) body.sha = sha;
      const res = await api(`/contents/decisions/sort.json`, { method: "PUT", body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`${res.status}`);
      sortSha = (await res.json()).content.sha; sort = Object.assign(base, pending);
      $("#stat").textContent = `Saved · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    } catch (e) {
      Object.assign(changes, pending); pending = changes; saveTimer = setTimeout(save, 8000);
      $("#stat").textContent = `Save failed, retrying (${e.message})`;
    }
  }

  function list(which) {
    let items = Object.entries(records).map(([id, v]) => ({ id, ...v }));
    if (filter.lane) items = items.filter(x => String(x.rec.lane) === filter.lane);
    if (filter.day) items = items.filter(x => x.path.split("/")[1] === filter.day);
    if (which === "keep") items = items.filter(x => statusOf(x.id) === "keep");
    else if (which === "nix") items = items.filter(x => statusOf(x.id) === "nix");
    else if (which === "swipe") items = items.filter(x => !statusOf(x.id));
    else items = items.filter(x => !statusOf(x.id)); // All shows only unsorted finds (kept and nixed live in their own tabs)
    return items.sort((a, b) => a.path < b.path ? 1 : -1); // newest first
  }
  function counts() {
    const all = Object.keys(records);
    $("#n-all").textContent = all.filter(id => !statusOf(id)).length;
    $("#n-swipe").textContent = all.filter(id => !statusOf(id)).length;
    $("#n-keep").textContent = all.filter(id => statusOf(id) === "keep").length;
    $("#n-nix").textContent = all.filter(id => statusOf(id) === "nix").length;
  }
  function imgUrl(r) {
    if (r.image_url) return r.image_url;
    if (r.iiif_url) return r.iiif_url.replace(/\/info\.json$/, "").replace(/\/$/, "") + "/full/800,/0/default.jpg";
    return "";
  }
  function clip(t, n) { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1).trim() + "…" : t; }
  function textCard(r) {
    const quote = r.passage || r.description_seen || r.depicts || r.why_this || "";

      const logs = (tree.tree || []).map(t => t.path).filter(p => /^inbox\/.+\/_search-log\.md$/.test(p)).sort();

  // ---------- v4 Library intake: go / no-go into the v4 source of truth ----------
  const IN = { batches: null, batch: S.get("intakeBatch", ""), manifest: null, go: {}, decided: {}, q: "", sha: null, blobs: {} };
  async function intakeBatches() {
    const r = await api(`/contents/v4/intake?ref=main`);
    if (r.status === 404) return [];
    return (await r.json()).filter(x => x.type === "dir").map(x => x.name).sort();
  }
  async function intakeLoad(batch) {
    IN.batch = batch; S.set("intakeBatch", batch); IN.manifest = null; IN.go = {}; IN.decided = {};
    const txt = await raw(`v4/intake/${batch}/manifest.json`);
    IN.manifest = txt ? JSON.parse(txt) : { items: [] };
    const d = await api(`/contents/v4/decisions/${batch}.jsonl?ref=main`);
    IN.sha = null;
    if (d.status !== 404) {
      const j = await d.json(); IN.sha = j.sha;
      unb64(j.content || "").split("\n").filter(Boolean).forEach(line => {
        try { const x = JSON.parse(line); IN.decided[x.id] = x.decision; } catch {}
      });
    }
    Object.entries(IN.decided).forEach(([id, dec]) => { if (dec === "go") IN.go[id] = true; });
  }
  let intakeTimer = null, intakePending = [];
  function intakeMark(id, isGo) {
    if (isGo) IN.go[id] = true; else delete IN.go[id];
    intakePending.push({ id, decision: isGo ? "go" : "no-go", by: "Cyrus", at: new Date().toISOString(), batch: IN.batch });
    clearTimeout(intakeTimer); intakeTimer = setTimeout(intakeSave, 2500);
  }
  async function intakeSave() {
    const lines = intakePending; intakePending = [];
    if (!lines.length) return;
    try {
      const path = `v4/decisions/${IN.batch}.jsonl`;
      for (let attempt = 0; attempt < 3; attempt++) {
        const cur = await api(`/contents/${path}?ref=main`);
        let body = "", sha;
        if (cur.status !== 404) { const j = await cur.json(); sha = j.sha; body = unb64(j.content || ""); }
        const next = body + lines.map(l => JSON.stringify(l)).join("\n") + "\n";
        const put = { message: `v4 decisions: ${lines.length} in ${IN.batch}`, content: b64(next), branch: "main" };
        if (sha) put.sha = sha;
        const res = await api(`/contents/${path}`, { method: "PUT", body: JSON.stringify(put) });
        if (res.ok) { $("#stat").textContent = `Saved · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`; return; }
        if (res.status !== 409 && res.status !== 422) throw new Error(res.status);
      }
      throw new Error("conflict");
    } catch (e) { intakePending = lines.concat(intakePending); toast("Could not save decisions yet; will retry"); intakeTimer = setTimeout(intakeSave, 8000); }
  }
  async function intakePreview(img) {
    const path = img.dataset.path; if (!path) return;
    if (IN.blobs[path]) { img.src = IN.blobs[path]; return; }
    try {
      const r = await api(`/contents/${encodeURI(path)}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } });
      if (!r.ok) throw 0;
      const u = URL.createObjectURL(await r.blob()); IN.blobs[path] = u; img.src = u;
    } catch { const box = img.closest(".thumb"); if (box) box.innerHTML = '<div class="noimg">Preview not available</div>'; }
  }
  function intakeCard(v) {

  async function renderIntake() {
    if (!IN.batches) { $("#main").innerHTML = `<div class="empty">Loading v4 batches…</div>`; IN.batches = await intakeBatches(); }
    if (!IN.batches.length) { $("#main").innerHTML = `<div class="empty">No v4 batches yet. They arrive in v4/intake/ one category at a time.</div>`; return; }
    if (!IN.batch || !IN.batches.includes(IN.batch)) IN.batch = IN.batches[0];
    if (!IN.manifest) { $("#main").innerHTML = `<div class="empty">Loading ${esc(IN.batch)}…</div>`; await intakeLoad(IN.batch); }
    const all = IN.manifest.items || [];
    const q = IN.q.toLowerCase();
    const items = all.filter(it => !q || JSON.stringify([it.v4.title, it.v4.summary, it.v4.tags]).toLowerCase().includes(q));
    const nGo = Object.keys(IN.go).length;
    $("#n-intake").textContent = `${nGo}/${all.length}`;
    $("#main").innerHTML = `<div class="ibar">
        <select id="ib">${IN.batches.map(b => `<option ${b === IN.batch ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>
        <input type="text" id="iq" placeholder="Search this batch" value="${esc(IN.q)}">
        <span class="stat"><b>${nGo}</b> go · <b>${all.length - nGo}</b> no-go (default) · ${all.length} in batch</span>
        <button class="linkbtn" id="v4sync">Sync to v4</button><span id="v4last">${V4.last ? `Last synced ${new Date(V4.last).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : "Not synced yet"}</span>
        <span>Everything is no-go until you click it. Click a card to mark it go; click again to undo.</span></div>
      <div class="grid">${items.map(it => {
        const v = it.v4, isGo = !!IN.go[v.id];
        const pic = it.v4.preview ? `<div class="thumb"><img data-path="v4/intake/${esc(IN.batch)}/${esc(v.preview)}" alt=""></div>` : `<div class="thumb">${intakeCard(v)}</div>`;
        const codes = (v.care.suggested_codes || []).map(c => `<span>${esc(c.replace("_", " "))}</span>`).join("");
        return `<div class="tile itile ${isGo ? "go" : ""}" data-id="${esc(v.id)}"><span class="gobadge">${isGo ? "Go" : "No-go"}</span>${pic}
          <div class="meta"><div class="t" title="${esc(v.title)}">${esc(v.title)}</div>
          <div class="sub one">${esc([v.date.as_stated !== "unknown" ? v.date.as_stated : "", (v.tags || []).slice(0, 3).join(", ")].filter(Boolean).join(" · "))}</div>
          ${codes ? `<div class="codes">${codes}</div>` : ""}
          ${v.hold ? `<div class="held" title="${esc(v.hold)}">Held: source ${esc(v.source_entry || "missing")}, won't publish yet</div>` : ""}
          <details class="more"><summary>Details</summary><div class="sub">${esc(clip(v.summary, 600))}</div>
            ${v.care.note && v.care.note !== "unknown" ? `<div class="sub">Care: ${esc(clip(v.care.note, 300))}</div>` : ""}
            ${v.creator_as_stated && v.creator_as_stated !== "unknown" ? `<div class="sub">By: ${esc(clip(v.creator_as_stated, 300))}</div>` : ""}
            ${v.holder && v.holder !== "unknown" ? `<div class="sub">Held by: ${esc(clip(v.holder, 200))}</div>` : ""}
            ${v.source_url && v.source_url !== "unknown" ? `<div class="sub"><a href="${esc(v.source_url)}" target="_blank" rel="noopener">Source page</a></div>` : ""}
            <div class="sub">Rights: ${esc(v.rights.as_stated)}${v.status_v3 ? ` · v3 status: ${esc(v.status_v3)}` : ""} · ${esc(v.former_ids.join(", "))}</div></details>
          </div></div>`;
      }).join("")}</div>`;
    $("#v4sync").onclick = () => syncV4(true);
    $("#ib").onchange = async e => { IN.manifest = null; IN.q = ""; await intakeLoad(e.target.value); renderIntake(); };
    $("#iq").oninput = e => { IN.q = e.target.value; clearTimeout(IN._qt); IN._qt = setTimeout(() => { renderIntake(); const el = $("#iq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 300); };
    $("#main").querySelectorAll(".itile").forEach(el => {
      el.onclick = e => {
        if (e.target.closest("details")) return;
        const id = el.dataset.id, now = !IN.go[id];
        intakeMark(id, now);
        el.classList.toggle("go", now); el.querySelector(".gobadge").textContent = now ? "Go" : "No-go";
        const nGo2 = Object.keys(IN.go).length;
        $("#n-intake").textContent = `${nGo2}/${all.length}`;
        const st = $("#main .ibar .stat"); if (st) st.innerHTML = `<b>${nGo2}</b> go · <b>${all.length - nGo2}</b> no-go (default) · ${all.length} in batch`;
      };
    });
    const io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) { intakePreview(en.target); io.unobserve(en.target); } }), { rootMargin: "400px" });
    $("#main").querySelectorAll("img[data-path]").forEach(img => io.observe(img));
  }
  window.addEventListener("beforeunload", e => { if (intakePending.length) { intakeSave(); e.preventDefault(); e.returnValue = ""; } });

  // ---------- Live sync: publish gos into v4/library in one commit (no GitHub Actions) ----------
  const V4 = { busy: false, last: S.get("v4LastSync", "") };
  const liveOn = () => S.get("v4live", true);
  async function gitBlobSha(text) {
    const body = new TextEncoder().encode(text), head = new TextEncoder().encode(`blob ${body.length}\0`);
    const buf = new Uint8Array(head.length + body.length); buf.set(head); buf.set(body, head.length);
    const h = await crypto.subtle.digest("SHA-1", buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function stableJSON(v) { return JSON.stringify(v, null, 1) + "\n"; }
  async function v4Desired(treeMap) {
    // every batch: manifest + latest decision per item; gos become library records
    const batches = Object.keys(treeMap).map(p => (p.match(/^v4\/intake\/([^/]+)\/manifest\.json$/) || [])[1]).filter(Boolean);
    const files = {}, index = [];
    let held = 0;
    for (const batch of batches.sort()) {
      const man = JSON.parse(await raw(`v4/intake/${batch}/manifest.json`) || '{"items":[]}');
      const decTxt = treeMap[`v4/decisions/${batch}.jsonl`] ? (await raw(`v4/decisions/${batch}.jsonl`)) || "" : "";
      const dec = {};
      decTxt.split("\n").filter(Boolean).forEach(l => { try { const d = JSON.parse(l); dec[d.id] = d; } catch {} });
      for (const it of man.items || []) {
        const d = dec[it.v4.id];
        if (!d || d.decision !== "go") continue;
        if (it.v4.hold) { held++; continue; }
        const v = JSON.parse(JSON.stringify(it.v4));
        v.admission = { decision: "go", decided_by: d.by || "Cyrus", decided_at: d.at || "unknown", batch };
        let prevPath = "";
        if (v.preview) {
          const src = `v4/intake/${batch}/${v.preview}`, name = v.preview.split("/").pop();
          prevPath = `v4/library/previews/${name}`;
          if (treeMap[src]) files[prevPath] = { sha: treeMap[src] };
          v.files = (v.files || []).filter(f => f.role !== "preview").concat([{ role: "preview", store: "repo", path: prevPath }]);
          delete v.preview;
        }
        files[`v4/library/records/${v.type}/${v.id}.json`] = { content: stableJSON(v) };
        index.push({ id: v.id, type: v.type, title: v.title, date: (v.date || {}).as_stated || "unknown", tags: v.tags || [],
                     preview: prevPath, display: v.rights.display, access: v.care.access, path: `v4/library/records/${v.type}/${v.id}.json` });
      }
    }
    index.sort((a, b) => a.path < b.path ? -1 : 1);
    files["v4/library/index.json"] = { content: stableJSON({ count: index.length, items: index }) };
    return { files, count: index.length, held };
  }
  async function syncV4(manual = false) {
    if (V4.busy) return; V4.busy = true;
    const btn = $("#v4sync"); if (btn) btn.textContent = "Syncing…";
    try {
      if (intakePending.length) { clearTimeout(intakeTimer); await intakeSave(); }
      for (let attempt = 0; attempt < 2; attempt++) {
        const ref = await (await api(`/git/ref/heads/main`)).json();
        const head = ref.object.sha;
        const commit = await (await api(`/git/commits/${head}`)).json();
        const tree = await (await api(`/git/trees/${commit.tree.sha}?recursive=1`)).json();
        const treeMap = {}; (tree.tree || []).forEach(t => { if (t.type === "blob") treeMap[t.path] = t.sha; });
        const { files, count, held } = await v4Desired(treeMap);
        const changes = []; let added = 0, updated = 0, removed = 0;
        for (const [path, f] of Object.entries(files)) {
          const want = f.sha || await gitBlobSha(f.content);
          if (treeMap[path] === want) continue;
          if (path !== "v4/library/index.json") treeMap[path] ? updated++ : added++;
          changes.push(f.sha ? { path, mode: "100644", type: "blob", sha: f.sha } : { path, mode: "100644", type: "blob", content: f.content });
        }
        for (const path of Object.keys(treeMap)) {
          if (/^v4\/library\/(records|previews)\/.+/.test(path) && !path.endsWith(".gitkeep") && !files[path]) {
            changes.push({ path, mode: "100644", type: "blob", sha: null }); removed++;
          }
        }
        if (!changes.length) { V4.last = new Date().toISOString(); S.set("v4LastSync", V4.last); if (manual) toast(`v4 is up to date · ${count} in the library`); break; }
        const nt = await (await api(`/git/trees`, { method: "POST", body: JSON.stringify({ base_tree: commit.tree.sha, tree: changes }) })).json();
        const msg = `v4 sync from Sorting Room: +${added} ~${updated} -${removed} (${count} in library)`;
        const nc = await (await api(`/git/commits`, { method: "POST", body: JSON.stringify({ message: msg, tree: nt.sha, parents: [head] }) })).json();
        const up = await api(`/git/refs/heads/main`, { method: "PATCH", body: JSON.stringify({ sha: nc.sha }) });
        if (up.ok) {
          V4.last = new Date().toISOString(); S.set("v4LastSync", V4.last);
          toast(`Published to v4: ${added ? `+${added} ` : ""}${updated ? `${updated} updated ` : ""}${removed ? `−${removed} ` : ""}· ${count} in the library${held ? ` · ${held} held for source` : ""}`);
          break;
        }
        if (attempt === 1) throw new Error("someone else saved at the same moment; try again");
      }
    } catch (e) { toast(`v4 sync failed: ${e.message || e}`); }
    finally {
      V4.busy = false;
      const b = $("#v4sync"); if (b) b.textContent = "Sync to v4";
      const ls = $("#v4last"); if (ls) ls.textContent = V4.last ? `Last synced ${new Date(V4.last).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : "Not synced yet";
    }
  }
  const liveLabel = () => { const b = $("#v4live"); if (b) b.textContent = liveOn() ? "v4 live: on" : "v4 live: off"; };

  function render() {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    counts();
    if (!token) return renderSetup();
    if (tab === "swipe") renderSwipe();
    else if (tab === "reflect") renderReflections();
    else if (tab === "activity") renderActivity();
    else if (tab === "intake") { renderIntake(); return; }
    else if (tab === "keep" || tab === "nix") renderGrid(tab);
    else renderGrid("all");
    const enlarge = t => { $("#lbimg").src = t.dataset.full; $("#lb").style.display = "flex"; };
    $("#main").querySelectorAll(".tile .thumb").forEach(t => {
      if (tab === "all" || !tab) {
        // All tab: one click on the picture keeps it; the corner button enlarges
        t.style.cursor = "pointer";
        t.onclick = () => { const id = t.closest(".tile").dataset.id; setStatus(id, "keep"); toast("Kept"); render(); };
        if (t.dataset.full) {
          const z = Object.assign(document.createElement("button"), { className: "zoom", title: "Enlarge", textContent: "⤢" });
          z.onclick = e => { e.stopPropagation(); enlarge(t); };
          t.appendChild(z);
        }
      } else if (t.dataset.full) t.onclick = () => enlarge(t);
    });
    $("#main").querySelectorAll(".card .cardinner[data-full]").forEach(t => t.ondblclick = () => enlarge(t));
  }

  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; location.hash = tab; render(); });
  window.addEventListener("hashchange", () => { tab = (location.hash || "#all").slice(1); render(); });


  $("#refresh").onclick = async () => {
    await load();
    if (tab === "intake") { IN.batches = null; IN.manifest = null; renderIntake(); }
    if (liveOn()) syncV4(false);
  };
  liveLabel();
  $("#v4live").onclick = () => { S.set("v4live", !liveOn()); liveLabel(); toast(liveOn() ? "v4 live is on: Refresh publishes your gos" : "v4 live is off: decisions save, nothing publishes"); };
  $("#settings").onclick = () => renderSetup();
  $("#lb").onclick = () => { $("#lb").style.display = "none"; $("#lbimg").src = ""; };
  document.addEventListener("keydown", e => {
    if (tab !== "swipe" || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") $("#bk")?.click();
    else if (e.key === "ArrowLeft") $("#bx")?.click();
    else if (e.key.toLowerCase() === "z") undo();
  });
  window.addEventListener("beforeunload", () => { if (Object.keys(pending).length) save(); });
  // ---------- Auto-update: reload by itself when a new version of this page is published ----------
  const BUILD = "20261108162921";
  setInterval(async () => {
    if (location.protocol === "file:" || document.visibilityState !== "visible") return;
    try {
      const v = await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (v.build && v.build !== BUILD && !intakePending.length) location.reload();
    } catch {}
  }, 60000);

  if (tab === "activity") tab = "all";
  render(); load();
  setInterval(() => { if (token && document.visibilityState === "visible") load(); }, POLL_MS);
})();
</script>
</body>
