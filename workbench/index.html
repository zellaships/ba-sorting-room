<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Aquatics · Workbench</title>
<style>
:root{--ink:#251f21;--muted:#625e60;--rule:#e6e3e1;--teal:#34685a;--teal2:#83b5a5;--paper:#fff;--wash:#f5f3f0;--gold:#a8741a;--rail:52px;--panel:380px;--drawer:400px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:var(--wash);font:15px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:6px 11px}
button:hover{background:var(--wash)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=search],input[type=url],textarea,select{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
a{color:var(--teal);text-underline-offset:3px}
h1{font:22px/1.1 Georgia,serif;margin:0}
h2{font:21px/1.25 Georgia,serif;margin:6px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:650;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}

/* frame */
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--rule);z-index:30}
header .sp{flex:1}
header .stat{font-size:13px;color:var(--muted)}
#rail{position:fixed;top:56px;left:0;bottom:0;width:var(--rail);background:#fff;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:25}
#rail button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;border-color:transparent}
#rail button.on{background:var(--ink);color:#fff}
#rail .tip{position:relative}
#rail button[title]:hover::after{content:attr(title);position:absolute;left:48px;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
#rail button{position:relative}

/* board */
#board{position:fixed;top:56px;left:var(--rail);right:0;bottom:0;overflow:hidden;cursor:grab;background:
  radial-gradient(circle at 1px 1px, #d9d5d1 1px, transparent 1.2px) 0 0/28px 28px, var(--wash);touch-action:none}
#board.panning{cursor:grabbing}
#board.linking{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:#8a8486;stroke-width:1.6}
#links path.sel{stroke:var(--teal);stroke-width:2.6}
#links path.thread{stroke:var(--gold);stroke-dasharray:6 5;stroke-width:2.2}
#links .hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.lbl{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.lbl.sel{border-color:var(--teal);color:var(--teal)}

.card{position:absolute;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);overflow:hidden;user-select:none;cursor:default}
.card.sel{outline:3px solid var(--teal);outline-offset:1px}
.card.linksrc{outline:3px dashed var(--gold)}
.card .img{background:#1b1718;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.card .cap{padding:8px 10px 10px}
.card .cap .t{font:15px/1.3 Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .cap .m{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .kind{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.card .handle{position:absolute;right:-1px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--teal);border:3px solid #fff;cursor:crosshair;opacity:0;transition:opacity .1s}
.card:hover .handle,.card.sel .handle{opacity:1}
.card .grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;opacity:.5;background:linear-gradient(135deg,transparent 50%,#bbb 50%)}
.card.note{background:#fffbe9;border-color:#efe3b5}
.card.note .body{padding:12px 14px;font-size:15px;white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto}
.card.marker{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:0}
.card.marker .body{padding:10px 20px;font:18px/1.2 Georgia,serif;white-space:nowrap}
.card.marker .sub{font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.card.embed .frame{width:100%;height:calc(100% - 36px);background:#111}
.card.embed iframe,.card.embed img{width:100%;height:100%;border:0;object-fit:contain;display:block}
.card.embed .bar{height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);white-space:nowrap;overflow:hidden}
.card.embed .shield{position:absolute;inset:0 0 36px 0}
.card.embed.live .shield{display:none}
.card.text .body{padding:12px 14px}
.card.text .q{font:15px/1.45 Georgia,serif;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}

/* drawer + panel */
.side{position:fixed;top:56px;bottom:0;background:#fff;z-index:20;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
#drawer{left:var(--rail);width:var(--pw,420px);border-right:1px solid var(--rule);transform:translateX(calc(-100% - var(--rail)));overflow:visible}
#drawer.open{transform:none}
#drawer.resizing{transition:none}
#drawer .inner{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}
/* resize edge: quiet until you need it */
.edge{position:absolute;top:0;bottom:0;right:-7px;width:14px;cursor:col-resize;z-index:3;touch-action:none}
.edge::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:transparent;transition:background .15s .05s}
.edge .grip{position:absolute;top:50%;left:1px;width:12px;height:44px;margin-top:-22px;border-radius:999px;background:#fff;border:1px solid var(--rule);
  box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transform:scaleY(.6);transition:opacity .15s .05s,transform .15s .05s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.edge .grip i{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.edge:hover::before,#drawer.resizing .edge::before{background:var(--teal2)}
.edge:hover .grip,#drawer.resizing .edge .grip{opacity:1;transform:none}
#drawer.resizing .edge .grip{border-color:var(--teal);background:var(--teal)}
#drawer.resizing .edge .grip i{background:#fff}
#drawer.atmax .edge::before{background:var(--gold)}
.wlabel{position:absolute;top:50%;left:calc(100% + 14px);transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
#drawer.resizing .wlabel{opacity:1}
#shore{position:fixed;top:56px;bottom:0;right:0;width:0;pointer-events:none;z-index:19;background:linear-gradient(90deg,rgba(37,31,33,.18),rgba(37,31,33,0));opacity:0;transition:opacity .2s}
#shore.on{opacity:1}
body.resizing{cursor:col-resize;user-select:none}
.crumbs{display:flex;align-items:center;gap:4px;padding:12px 14px;border-bottom:1px solid var(--rule);min-height:52px;font-size:14px}
.crumbs .cb{border:0;background:transparent;padding:4px 8px;border-radius:6px;color:var(--teal);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.crumbs .cb:hover{background:var(--wash)}
.crumbs .cb.here{color:var(--ink);font-weight:600;cursor:default}
.crumbs .cb.here:hover{background:transparent}
.crumbs .sep{color:#bbb}
.crumbs .sp{flex:1}
.crumbs .x{border:0;background:transparent;font-size:18px;color:var(--muted);padding:2px 8px}
.catmenu{position:absolute;z-index:10;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;min-width:200px}
.catmenu button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;text-align:left;padding:7px 10px;border-radius:6px}
.catmenu button.on{background:var(--wash);font-weight:600}
.catmenu .c{color:var(--muted)}
.recimg{background:#1b1718;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;position:relative}
.recimg img{max-width:100%;max-height:calc(100vh - 260px);object-fit:contain;display:block}
.recnav{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
.recnav .muted{flex:1;text-align:center}
.side .hd{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.side .bd{flex:1;overflow-y:auto;padding:12px 16px 30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:3px 10px;font-size:13px;border-radius:999px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips .c{opacity:.6;margin-left:4px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.li{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;cursor:grab}
.li .img{height:140px;background:#1b1718;display:flex;align-items:center;justify-content:center}
.li .img img{max-width:100%;max-height:100%;object-fit:contain}
.li .noimg{height:120px;padding:10px;font:13px/1.35 Georgia,serif;color:var(--muted);overflow:hidden;background:var(--wash)}
.li .t{padding:6px 8px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li.on{outline:2px solid var(--teal)}
.li .k{font-size:11px;color:var(--muted);padding:0 8px 6px}
.emptybox{padding:20px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);font-size:14px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ro{font-size:13px;color:var(--muted);margin:4px 0;word-break:break-word}
.pimg{background:#1b1718;border-radius:8px;overflow:hidden;margin-bottom:10px}
.pimg img{width:100%;max-height:340px;object-fit:contain;display:block}
.conn{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.conn .lab{color:var(--muted);font-size:12px}
.conn a{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thr{border:1px solid var(--rule);border-radius:8px;padding:10px;margin:8px 0}
.thr.on{border-color:var(--gold)}
.thr ol{margin:6px 0 0 18px;padding:0;font-size:14px}
.thr li{margin:2px 0;cursor:pointer}
.ver{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}

/* present */
#present{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 8px;display:none;align-items:center;gap:8px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#present.on{display:flex}
#present button{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);border-radius:999px}
#present .where{font-size:13px;padding:0 6px;opacity:.85;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
#zoomctl{position:fixed;right:14px;bottom:14px;z-index:15;display:flex;gap:4px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:4px}
#zoomctl button{border:0;padding:4px 10px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#gate{position:fixed;inset:0;background:var(--wash);z-index:80;display:none;align-items:center;justify-content:center}
#gate .box{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:28px;max-width:520px}
#lb{position:fixed;inset:0;background:rgba(10,8,9,.92);z-index:90;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:94vw;max-height:94vh}
.modal{position:fixed;inset:0;background:rgba(20,16,17,.35);z-index:70;display:none;align-items:center;justify-content:center}
.modal .box{background:#fff;border-radius:12px;padding:20px;width:min(460px,92vw)}

/* selection marquee */
#marquee{position:fixed;border:1px solid var(--teal);background:rgba(52,104,90,.08);border-radius:3px;pointer-events:none;z-index:18;display:none}
#board.spacepan{cursor:grab}
/* free text: no chrome until you need it */
.card.ftext{background:transparent;border:1px solid transparent;box-shadow:none;overflow:visible;border-radius:4px}
.card.ftext:hover{border-color:rgba(37,31,33,.12)}
.card.ftext.sel{outline:2px solid var(--teal);outline-offset:3px;border-color:transparent}
.card.ftext .grip{display:none}
.card.ftext .ew{position:absolute;right:-6px;top:0;bottom:0;width:10px;cursor:ew-resize}
.rt{font:16px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink);outline:none;word-break:break-word;min-height:1.5em;cursor:inherit}
.rt[contenteditable=true]{cursor:text;user-select:text}
.rt:empty::before{content:attr(data-ph);color:#b8b2b4}
.rt h1{font:700 1.75em/1.2 Georgia,serif;margin:.35em 0 .2em}.rt h2{font:700 1.4em/1.25 Georgia,serif;margin:.35em 0 .2em}.rt h3{font:650 1.15em/1.3 system-ui;margin:.3em 0 .15em}
.rt p,.rt div{margin:0 0 .25em}
.rt ul,.rt ol{margin:.15em 0 .35em;padding-left:1.4em}.rt li{margin:.12em 0;padding-left:.15em}.rt li::marker{color:var(--muted)}
.rt blockquote{margin:.3em 0;padding-left:.8em;border-left:3px solid var(--rule);color:#4a4446}
.rt code{font:.9em ui-monospace,Menlo,monospace;background:var(--wash);border-radius:4px;padding:.05em .3em}
.rt a{color:var(--teal)}
.rt hr{border:0;border-top:1px solid var(--rule);margin:.6em 0}
/* labeled notes */
.card.note{--nc:#fffbe9;--nl:#a8741a;background:var(--nc);border-color:rgba(0,0,0,.06)}
.card.note .nlabel{display:flex;align-items:center;gap:6px;padding:9px 12px 0;font:650 11px/1.2 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--nl);min-height:24px}
.card.note .nlabel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nl);flex:none}
.card.note .nlabel .lt{outline:none;min-width:30px}
.card.note .nlabel .lt:empty::before{content:"Label";opacity:.45}
.card.note .rt{padding:6px 12px 12px;height:calc(100% - 26px);overflow:auto;font-size:15px}
.swatches{display:flex;gap:8px;margin:6px 0 4px}
.swatches button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
/* connections: hover to break */
.lmid{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;z-index:2}
.lmid .lbl{position:static;transform:none}
.lmid .dot{width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #8a8486;cursor:pointer;transition:transform .12s}
.lmid .brk{display:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);background:#fff;color:#b5432f;font-size:14px;line-height:1;padding:0;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.lmid:hover .brk,.lmid.hot .brk,.lmid.sel .brk{display:flex}
.lmid:hover .dot,.lmid.hot .dot{transform:scale(1.3);border-color:var(--teal)}
#links path.hot{stroke:var(--teal);stroke-width:2.6}
.conn .brk{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 6px}
.conn .brk:hover{color:#b5432f}
.selcount{font:22px/1.2 Georgia,serif;margin:4px 0 12px}
</style>
</head>
<body>
<header>
  <h1>Black Aquatics</h1><span class="eyebrow">Workbench</span>
  <span class="sp"></span>
  <span class="stat" id="stat">Loading…</span>
  <button id="saveBtn" class="primary" title="Save a version of the board to the repo">Save</button>
  <a href="../" class="muted">Sorting Room</a>
</header>

<nav id="rail">
  <button data-tool="library" title="Library (L)">▦</button>
  <button data-tool="text" title="Add text (T)" style="font:600 18px Georgia,serif">T</button>
  <button data-tool="note" title="Add a note (N)">✎</button>
  <button data-tool="embed" title="Add video, GIF or link (E)">▶</button>
  <button data-tool="marker" title="Place a week marker (W)">⚑</button>
  <button data-tool="threads" title="Threads">≋</button>
  <button data-tool="versions" title="Versions">⟲</button>
  <button data-tool="studio" title="Card studio: how each category looks">◧</button>
  <span style="flex:1"></span>
  <button data-tool="fit" title="See everything (F)">⤢</button>
</nav>

<div id="marquee"></div>
<div id="board"><div id="world"><svg id="links"></svg></div></div>

<aside id="drawer" class="side"><div class="inner"></div><div class="edge" title="Drag to resize · double-click to switch between your width and wide"><span class="grip"><i></i><i></i><i></i></span></div><span class="wlabel"></span></aside>
<div id="shore"></div>

<div id="present"><button id="pPrev">←</button><span class="where" id="pWhere"></span><button id="pNext">→</button><button id="pStop">Done</button></div>
<div id="zoomctl"><button id="zOut" title="Zoom out">−</button><button id="zPct" title="Reset to 100%">100%</button><button id="zIn" title="Zoom in">+</button></div>
<div id="toast"></div>
<div id="lb"><img alt=""></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="gate"><div class="box">
  <h2>Connect to GitHub</h2>
  <p>The workbench reads the v4 library from your private repo with the same key as the Sorting Room. Open the <a href="../">Sorting Room</a>, connect there once, then come back.</p>
</div></div>

<script src="cards.js"></script>
<script>
(() => {
  // ---------- basics ----------
  const REPO_DEF = "zellaships/black-aquatics-research";
  const BOARD_PATH = "v4/boards/main.json";
  const S = { get(k, d) { try { const v = localStorage.getItem("ba." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
              set(k, v) { try { localStorage.setItem("ba." + k, JSON.stringify(v)); } catch {} } };
  const token = S.get("token", ""), repo = S.get("repo", REPO_DEF);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = p => p + "-" + Math.random().toString(36).slice(2, 9);
  const clip = (t, n) => { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
  const known = v => v && v !== "unknown" ? v : "";
  function toast(m) { const t = $("#toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2200); }
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
  async function api(path, opts = {}) {
    const r = await fetch(`https://api.github.com/repos/${repo}${path}`, { ...opts,
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
    if (!r.ok && r.status !== 404) throw new Error(`${r.status}`);
    return r;
  }
  async function raw(path, ref = "main") {
    const r = await api(`/contents/${encodeURI(path)}?ref=${ref}`, { headers: { Accept: "application/vnd.github.raw+json" } });
    return r.status === 404 ? null : r.text();
  }
  const PV = {};
  async function preview(path) {
    if (!path) return "";
    if (/^https?:/.test(path)) return path;
    if (PV[path]) return PV[path];
    PV[path] = (async () => {
      const r = await api(`/contents/${encodeURI(path)}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } });
      if (!r.ok) return "";
      return URL.createObjectURL(await r.blob());
    })();
    return PV[path];
  }
  function hydrate(root) {
    (root || document).querySelectorAll("img[data-pv]:not([src])").forEach(async img => {
      const u = await preview(img.dataset.pv); if (u) img.src = u; else img.replaceWith(Object.assign(document.createElement("span"), { className: "muted", textContent: "No preview" }));
    });
  }

  const CATS = [["image", "Images"], ["work", "Works"], ["person", "People"], ["place", "Places"], ["excerpt", "Excerpts"],
                ["event", "Events"], ["concept", "Concepts"], ["practice", "Practices"], ["nature", "Nature"]];

       <p class="muted" style="margin-top:0">Drag any of them to move them together. Option-drag or ⌘D duplicates, arrow keys nudge, Delete removes.</p>
       <div class="row"><button id="mDup">Duplicate</button><button id="mThr">Add all to a thread</button><button id="mDel">Remove from board</button></div>`);
    $("#mDup").onclick = () => { let n; change(() => n = duplicate(ids, 24, 24)); selIds = new Set(n); draw(); viewMulti(); };
    $("#mThr").onclick = () => addToThread(ids);
    $("#mDel").onclick = () => removeCards(ids);
  }
  // Notes, text, embeds, markers
  function viewCard(v) {
    const c = cardById(v.cardId); if (!c) return toLibrary();
    const kind = c.kind === "marker" ? "Week marker" : c.kind === "embed" ? "Embed" : c.kind === "ftext" ? "Text" : "Note";
    const conns = B.links.filter(l => l.from === c.id || l.to === c.id);
    const threadsIn = B.threads.filter(t => t.steps.includes(c.id));
    const body = shell([{ label: "Library", go: toLibrary }, { label: "On the board", go: () => centerOn(c.x + c.w / 2, c.y + c.h / 2) }, { label: kind }],
      `<h2>${esc(cardTitle(c))}</h2>
       ${c.kind === "embed" ? `<div class="field"><label>Link</label><input type="url" data-f="url" value="${esc(c.url)}"></div><p class="muted">Double-click the card to play it; double-click again to move it.</p>`
         : c.kind === "note" ? `<div class="field"><label>Label</label><input type="text" data-f="label" value="${esc(c.label || "")}" placeholder="e.g. Question, Prompt, Reading"></div>
             <div class="field"><label>Color</label><div class="swatches">${Object.entries(NOTE_COLORS).map(([k, [bg, fg]]) => `<button data-col="${k}" class="${(c.color || "sand") === k ? "on" : ""}" style="background:${bg};box-shadow:0 0 0 ${(c.color || "sand") === k ? 2 : 1}px ${(c.color || "sand") === k ? "var(--ink)" : fg}" title="${k}"></button>`).join("")}</div></div>
             <button id="cEdit">Edit the note</button>`
         : c.kind === "ftext" ? `<button id="cEdit">Edit text</button>` : `<button id="cEdit">Edit marker</button>`}
       <div class="row" style="margin-top:12px"><button id="cThread">Add to thread</button><button id="cDel">Remove from board</button></div>
       <h3 class="eyebrow" style="margin-top:20px">Connections</h3>${connList(c, conns)}
       ${threadsIn.length ? `<h3 class="eyebrow" style="margin-top:20px">In threads</h3>${threadsIn.map(t => `<div class="ro">${esc(t.name)}</div>`).join("")}` : ""}`);
    if ($("#cEdit")) $("#cEdit").onclick = () => { const el = world.querySelector(`.card[data-id="${c.id}"]`); if (c.kind === "marker") editText(c); else editRich(c, el && el.querySelector(".rt")); };
    const u = body.querySelector("[data-f=url]"); if (u) u.onchange = () => change(() => c.url = u.value.trim());
    const lab = body.querySelector("[data-f=label]"); if (lab) { let t; lab.oninput = () => { clearTimeout(t); t = setTimeout(() => change(() => c.label = lab.value.trim()), 300); }; }
    body.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { change(() => c.color = b.dataset.col); viewCard(v); });
    $("#cDel").onclick = () => { removeCard(c.id); toLibrary(); };
    $("#cThread").onclick = () => addToThread(c.id);
    bindGo(body);
  }

  // Connection
  function viewLink(v) {
    const l = B.links.find(x => x.id === v.id); if (!l) return toLibrary();
    const a = cardById(l.from), b = cardById(l.to);
    shell([{ label: "Library", go: toLibrary }, { label: "On the board", go: () => { if (a) centerOn(a.x + a.w / 2, a.y + a.h / 2); } }, { label: "Connection" }],
      `<h2>${esc(cardTitle(a))} → ${esc(cardTitle(b))}</h2>
       <div class="field"><label>What connects them?</label><input type="text" data-f="label" value="${esc(l.label || "")}" placeholder="e.g. same river, answers, echoes, contradicts"></div>
       <div class="row"><button id="lSwap">Flip direction</button><button id="lDel">Break connection</button></div>`);
    const inp = inner.querySelector("[data-f=label]"); let t = null;
    inp.oninput = () => { clearTimeout(t); t = setTimeout(() => change(() => l.label = inp.value.trim()), 400); };
    $("#lSwap").onclick = () => change(() => { [l.from, l.to] = [l.to, l.from]; });
    $("#lDel").onclick = () => breakLink(l.id);
  }

  function cardTitle(c) {
    if (!c) return "(removed)";
    if (c.kind === "record") return (LIBBY[c.ref] || {}).title || "Record";
    if (c.kind === "embed") return embedOf(c.url).label;
    const plain = c.html != null ? (() => { const d = document.createElement("div"); d.innerHTML = c.html; return d.textContent; })() : c.text;
    if (c.kind === "note") return c.label ? (clip(plain, 40) ? `${c.label}: ${clip(plain, 40)}` : c.label) : (clip(plain, 60) || "Note");
    return clip(plain, 60) || (c.kind === "marker" ? "Week marker" : c.kind === "ftext" ? "Text" : "Note");
  }
  function removeCards(ids) {
    const set = new Set(ids);
    change(() => { B.cards = B.cards.filter(c => !set.has(c.id)); B.links = B.links.filter(l => !set.has(l.from) && !set.has(l.to)); B.threads.forEach(t => t.steps = t.steps.filter(s => !set.has(s))); });
    selIds = new Set(); sel = null; draw(); toLibrary();
    toast(`Removed ${ids.length} ${ids.length === 1 ? "card" : "cards"} · ⌘Z to undo`);
  }
  function removeCard(id) {
    change(() => { B.cards = B.cards.filter(c => c.id !== id); B.links = B.links.filter(l => l.from !== id && l.to !== id); B.threads.forEach(t => t.steps = t.steps.filter(s => s !== id)); });
    world.querySelector(`.card[data-id="${id}"]`)?.remove(); sel = null; draw();
  }
  const renderLibrary = () => { if (VIEW.kind === "library" && panel.classList.contains("open")) viewLibrary(); };

  // ---------- threads ----------
  function addToThread(cardIdOrIds) {
    const cardIds = Array.isArray(cardIdOrIds) ? cardIdOrIds : [cardIdOrIds];
    const opts = B.threads.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    modal(`<h2>Add to a thread</h2><p class="muted">A thread is an ordered path through the board, for walking a session from card to card.</p>
      ${B.threads.length ? `<div class="field"><label>Thread</label><select id="m-thr">${opts}<option value="__new">New thread…</option></select></div>` : ""}
      <div class="field" id="m-newwrap" style="${B.threads.length ? "display:none" : ""}"><label>New thread name</label><input type="text" id="m-new" placeholder="e.g. Week 1: Kalunga line"></div>
      <div class="row"><button class="primary" id="m-ok">Add</button><button id="m-cancel">Cancel</button></div>`, () => {
      let tid = $("#m-thr") ? $("#m-thr").value : "__new";
      change(() => {
        if (tid === "__new") { const t = { id: uid("t"), name: $("#m-new").value.trim() || `Thread ${B.threads.length + 1}`, steps: [] }; B.threads.push(t); tid = t.id; }
        const t = B.threads.find(x => x.id === tid); cardIds.forEach(cardId => { if (!t.steps.includes(cardId)) t.steps.push(cardId); });
      });
      toast("Added to the thread"); renderView();
    });
    const s = $("#m-thr"); if (s) s.onchange = () => $("#m-newwrap").style.display = s.value === "__new" ? "" : "none";
  }
  function viewThreads() {
    const body = shell([{ label: "Library", go: toLibrary }, { label: "Threads" }],
      `<p class="muted" style="margin-top:0">Ordered paths through the board. Select a card and choose “Add to thread”; Present walks it one card at a time.</p>
      ${B.threads.length ? B.threads.map(t => `<div class="thr ${sel && sel.type === "thread" && sel.id === t.id ? "on" : ""}" data-t="${t.id}">
        <div class="row" style="justify-content:space-between"><b>${esc(t.name)}</b><span class="muted">${t.steps.length} stops</span></div>
        <ol>${t.steps.map((s, i) => `<li data-step="${i}">${esc(cardTitle(cardById(s)))} <button class="ghost" data-up="${i}" title="Move up">↑</button><button class="ghost" data-rm="${i}" title="Remove">✕</button></li>`).join("")}</ol>
        <div class="row" style="margin-top:8px"><button class="primary" data-present="${t.id}" ${t.steps.length ? "" : "disabled"}>Present</button><button data-show="${t.id}">Show path</button><button data-ren="${t.id}">Rename</button><button data-del="${t.id}">Delete</button></div></div>`).join("")
        : `<div class="emptybox">No threads yet.</div>`}`);
    const T = id => B.threads.find(t => t.id === id);
    body.querySelectorAll(".thr").forEach(box => {
      const t = T(box.dataset.t);
      box.querySelectorAll("[data-step]").forEach(li => li.onclick = e => { if (e.target.closest("button")) return; const c = cardById(t.steps[+li.dataset.step]); if (c) centerOn(c.x + c.w / 2, c.y + c.h / 2); });
      box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) change(() => { [t.steps[i - 1], t.steps[i]] = [t.steps[i], t.steps[i - 1]]; }); viewThreads(); });
      box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { change(() => t.steps.splice(+b.dataset.rm, 1)); viewThreads(); });
    });
    body.querySelectorAll("[data-present]").forEach(b => b.onclick = () => startPresent(b.dataset.present));
    body.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { sel = { type: "thread", id: b.dataset.show }; draw(); viewThreads(); });
    body.querySelectorAll("[data-ren]").forEach(b => b.onclick = () => { const t = T(b.dataset.ren); modal(`<h2>Rename thread</h2><input type="text" id="m-new" value="${esc(t.name)}"><div class="row" style="margin-top:10px"><button class="primary" id="m-ok">Save</button><button id="m-cancel">Cancel</button></div>`, () => { change(() => t.name = $("#m-new").value.trim() || t.name); viewThreads(); }); });
    body.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (!confirm("Delete this thread? The cards stay on the board.")) return; change(() => B.threads = B.threads.filter(t => t.id !== b.dataset.del)); viewThreads(); });
  }
  const renderThreads = () => openView({ kind: "threads" });
  function startPresent(tid) { present = { thread: tid, i: 0 }; $("#present").classList.add("on"); closePanel(); setTool(null); step(0); }
  function step(d) {
    const t = B.threads.find(x => x.id === present.thread); if (!t || !t.steps.length) return stopPresent();
    present.i = Math.max(0, Math.min(t.steps.length - 1, present.i + d));
    const c = cardById(t.steps[present.i]); if (!c) return;
    const r = board.getBoundingClientRect(), z = Math.min(1.6, Math.max(0.4, Math.min(r.width * 0.55 / c.w, r.height * 0.7 / c.h)));
    world.style.transition = "transform .45s ease"; centerOn(c.x + c.w / 2, c.y + c.h / 2, z); setTimeout(() => world.style.transition = "", 480);
    sel = { type: "card", id: c.id }; draw();
    $("#pWhere").textContent = `${t.name} · ${present.i + 1} of ${t.steps.length} · ${cardTitle(c)}`;
  }
  function stopPresent() { present = null; $("#present").classList.remove("on"); draw(); }
  $("#pPrev").onclick = () => step(-1); $("#pNext").onclick = () => step(1); $("#pStop").onclick = stopPresent;

  // ---------- panel width: drag the edge ----------
  const PANEL_MIN = 320, SHORE = 140;                     // the board always keeps a 140px shore on the right
  const railW = () => document.querySelector("#rail").offsetWidth;
  const maxW = () => Math.max(PANEL_MIN, window.innerWidth - railW() - SHORE);
  let pw = S.get("wb.pw", 420), pwRegular = S.get("wb.pwReg", 420);
  const setPW = w => { pw = Math.round(Math.min(maxW(), Math.max(PANEL_MIN, w))); panel.style.setProperty("--pw", pw + "px"); panel.classList.toggle("atmax", pw >= maxW() - 1); };
  setPW(pw);
  window.addEventListener("resize", () => setPW(pw));
  const snaps = () => [["Narrow", 420], ["Half", Math.round((window.innerWidth - railW()) / 2)], ["Wide", maxW()]];
  const edge = panel.querySelector(".edge"), wlabel = panel.querySelector(".wlabel"), shore = $("#shore");
  edge.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation(); edge.setPointerCapture(e.pointerId);
    const x0 = e.clientX, w0 = pw; panel.classList.add("resizing"); document.body.classList.add("resizing");
    shore.style.width = SHORE + "px";
    const mv = ev => {
      let w = w0 + ev.clientX - x0;
      const mx = maxW(), soft = mx - 90;
      if (w > soft) w = soft + (w - soft) * 0.4;           // resistance as you near the far side
      let name = "";
      for (const [n, sw] of snaps()) if (Math.abs(w - sw) < 22) { w = sw; name = n; }
      setPW(w);
      shore.classList.toggle("on", pw > mx - 200);
      wlabel.textContent = (name ? name + " · " : "") + pw + " px" + (pw >= mx - 1 ? " · the board stays in view" : "");
    };
    const up = () => {
      edge.removeEventListener("pointermove", mv); edge.removeEventListener("pointerup", up);
      panel.classList.remove("resizing"); document.body.classList.remove("resizing"); shore.classList.remove("on");
      S.set("wb.pw", pw); if (pw < maxW() - 60) { pwRegular = pw; S.set("wb.pwReg", pw); }
    };
    edge.addEventListener("pointermove", mv); edge.addEventListener("pointerup", up);
  });
  edge.addEventListener("dblclick", () => {
    panel.style.transition = "width .22s ease, transform .18s";
    setPW(pw >= maxW() - 60 ? pwRegular : maxW()); S.set("wb.pw", pw);
    setTimeout(() => panel.style.transition = "", 260);
  });

  // ---------- save + versions ----------
  async function saveBoard(message) {
    $("#saveBtn").textContent = "Saving…";
    try {
      B.updated_at = B.updated_at || new Date().toISOString();
      for (let i = 0; i < 2; i++) {
        const body = { message: message || `Board: ${B.cards.length} cards, ${B.links.length} connections`, content: b64(JSON.stringify(B, null, 1) + "\n"), branch: "main" };
        if (boardSha) body.sha = boardSha;
        const r = await api(`/contents/${BOARD_PATH}`, { method: "PUT", body: JSON.stringify(body) });
        if (r.ok) { boardSha = (await r.json()).content.sha; dirty = false; S.set("wb.draft", null); lastSaved = B.updated_at;
          $("#saveBtn").textContent = "Saved"; $("#saveBtn").classList.remove("primary");
          $("#stat").textContent = `${LIB.length} in the library · ${B.cards.length} on the board · saved ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`; return true; }
        if (r.status === 409 || r.status === 422) {
          // someone else saved: keep both by taking their cards we do not have
          const cur = await api(`/contents/${BOARD_PATH}?ref=main`); const j = await cur.json(); boardSha = j.sha;
          const theirs = JSON.parse(unb64(j.content)); const mine = new Set(B.cards.map(c => c.id)), ml = new Set(B.links.map(l => l.id));
          theirs.cards.forEach(c => { if (!mine.has(c.id)) B.cards.push(c); }); theirs.links.forEach(l => { if (!ml.has(l.id)) B.links.push(l); });
          toast("Merged with a newer save"); draw(); continue;
        }
        throw new Error(r.status);
      }
    } catch (e) { $("#saveBtn").textContent = "Save"; toast(`Could not save (${e.message}). Your changes are kept in this browser.`); }
    return false;
  }
  $("#saveBtn").onclick = () => saveBoard();
  setInterval(() => { if (dirty && token) saveBoard("Board autosave"); }, 120000);
  async function viewVersions() {
    const body = shell([{ label: "Library", go: toLibrary }, { label: "Versions" }],
      `<p class="muted" style="margin-top:0">Every save is kept in the repo. Restoring loads that version; save to keep it.</p><div id="vbody"><div class="muted">Loading…</div></div>`);
    try {
      const list = await (await api(`/commits?path=${BOARD_PATH}&per_page=40`)).json();
      if (VIEW.kind !== "versions") return;
      $("#vbody").innerHTML = (Array.isArray(list) && list.length) ? list.map(c => `<div class="ver"><div>${esc(c.commit.message)}</div>
        <div class="row" style="justify-content:space-between"><span class="muted">${new Date(c.commit.author.date).toLocaleString()}</span><button data-v="${c.sha}">Restore</button></div></div>`).join("")
        : `<div class="emptybox">No saved versions yet. Press Save at the top.</div>`;
      $("#vbody").querySelectorAll("[data-v]").forEach(b => b.onclick = async () => {
        const t = await raw(BOARD_PATH, b.dataset.v); if (!t) return;
        change(() => { const old = JSON.parse(t); B.cards = old.cards || []; B.links = old.links || []; B.threads = old.threads || []; });
        world.querySelectorAll(".card").forEach(n => n.remove()); draw(); fit(); toast("Version restored. Save to keep it.");
      });
    } catch (e) { $("#vbody").innerHTML = `<div class="muted">Could not load versions (${e.message}).</div>`; }
  }

  // ---------- tools ----------
  function setTool(t) {
    tool = t === tool ? null : t;
    board.classList.toggle("linking", tool === "link");
    const toggleView = k => { if (panel.classList.contains("open") && VIEW.kind === k) closePanel(); else openView({ kind: k }); };
    if (tool === "library") { tool = null; toggleView("library"); return; }
    if (tool === "threads") { tool = null; toggleView("threads"); return; }
    if (tool === "versions") { tool = null; toggleView("versions"); return; }
    railState();
    if (tool === "studio") { location.href = "studio.html"; return; }
    if (tool === "fit") { tool = null; fit(); setTool(null); return; }
    if (tool === "note" || tool === "embed" || tool === "marker" || tool === "text") toast(tool === "text" ? "Click where the text should go" : "Click on the board to place it");
  }
  document.querySelectorAll("#rail [data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
  function modal(html, ok) {
    $("#mbox").innerHTML = html; $("#modal").style.display = "flex";
    const close = () => $("#modal").style.display = "none";
    $("#m-ok").onclick = () => { close(); ok(); };
    $("#m-cancel").onclick = close;
    const f = $("#mbox").querySelector("textarea,input"); if (f) { f.focus(); f.select && f.select(); }
  }
  document.addEventListener("keydown", e => {
    if ($("#modal").style.display === "flex") { if (e.key === "Escape") $("#modal").style.display = "none"; return; }
    const k = e.key.toLowerCase(), m = e.metaKey || e.ctrlKey;
    if (typing()) {
      if (m && k === "s") { e.preventDefault(); saveBoard(); }
      return;                                                     // text editing owns the keyboard
    }
    if (k === " ") { e.preventDefault(); if (!spaceDown) { spaceDown = true; board.classList.add("spacepan"); } return; }
    if (m && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (m && k === "s") { e.preventDefault(); saveBoard(); return; }
    if (m && k === "a") { e.preventDefault(); selIds = new Set(B.cards.map(c => c.id)); afterMultiSelect(); return; }
    if (m && k === "d") { e.preventDefault(); if (!selIds.size) return; let n; change(() => n = duplicate([...selIds], 24, 24)); selIds = new Set(n); afterMultiSelect(); return; }
    if (m && (k === "=" || k === "+" || k === "-")) {           // size selected text without entering it
      const t = [...selIds].map(cardById).filter(c => c && (c.kind === "ftext" || c.kind === "note"));
      if (t.length) { e.preventDefault(); change(() => t.forEach(c => c.size = stepSize(c.size || (c.kind === "note" ? 15 : 16), k === "-" ? -1 : 1))); }
      return;
    }
    if (present) { if (k === "arrowright") step(1); else if (k === "arrowleft") step(-1); else if (k === "escape") stopPresent(); return; }
    if (k === "escape") {
      if ($("#lb").style.display === "flex") { $("#lb").style.display = "none"; return; }
      if (selIds.size || sel) { selIds = new Set(); sel = null; setTool(null); draw(); return; }
      setTool(null); closePanel(); return;
    }
    if (k.startsWith("arrow") && selIds.size) {                   // nudge; Shift for bigger steps
      e.preventDefault(); const d = e.shiftKey ? 10 : 1, dx = k === "arrowleft" ? -d : k === "arrowright" ? d : 0, dy = k === "arrowup" ? -d : k === "arrowdown" ? d : 0;
      change(() => selIds.forEach(id => { const c = cardById(id); if (c) { c.x += dx; c.y += dy; } })); return;
    }
    if ((k === "arrowright" || k === "arrowleft") && panel.classList.contains("open") && VIEW.kind === "record" && VIEW.list) { const b = $(k === "arrowright" ? "#rnext" : "#rprev"); if (b && !b.disabled) b.click(); return; }
    if (k === "enter" && selIds.size === 1) { const c = cardById([...selIds][0]); const el = c && world.querySelector(`.card[data-id="${c.id}"]`); if (c && (c.kind === "ftext" || c.kind === "note")) { e.preventDefault(); editRich(c, el.querySelector(".rt")); } return; }
    if (k === "backspace" || k === "delete") {
      if (selIds.size) { e.preventDefault(); removeCards([...selIds]); }
      else if (sel && sel.type === "link") { e.preventDefault(); breakLink(sel.id); }
      return;
    }
    if (m || e.altKey) return;
    if (k === "l") setTool("library"); else if (k === "n") setTool("note"); else if (k === "t") setTool("text"); else if (k === "e") setTool("embed");
    else if (k === "w") setTool("marker"); else if (k === "f") fit();
  });
  document.addEventListener("keyup", e => { if (e.key === " ") { spaceDown = false; board.classList.remove("spacepan"); } });
  window.addEventListener("blur", () => { spaceDown = false; board.classList.remove("spacepan"); });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  load();
})();
</script>
</body>
</html>
