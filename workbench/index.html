<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Aquatics · Workbench</title>
<style>
:root{--ink:#251f21;--muted:#625e60;--rule:#e6e3e1;--teal:#34685a;--teal2:#83b5a5;--paper:#fff;--wash:#f5f3f0;--gold:#a8741a;--rail:52px;--panel:380px;--drawer:400px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:var(--wash);font:15px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:6px 11px}
button:hover{background:var(--wash)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=search],input[type=url],textarea,select{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
a{color:var(--teal);text-underline-offset:3px}
h1{font:22px/1.1 Georgia,serif;margin:0}
h2{font:21px/1.25 Georgia,serif;margin:6px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:650;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}

/* frame */
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--rule);z-index:30}
header .sp{flex:1}
header .stat{font-size:13px;color:var(--muted)}
#rail{position:fixed;top:56px;left:0;bottom:0;width:var(--rail);background:#fff;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:25}
#rail button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;border-color:transparent}
#rail button.on{background:var(--ink);color:#fff}
#rail .tip{position:relative}
#rail button[title]:hover::after{content:attr(title);position:absolute;left:48px;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
#rail button{position:relative}

/* board */
#board{position:fixed;top:56px;left:var(--rail);right:0;bottom:0;overflow:hidden;cursor:grab;background:
  radial-gradient(circle at 1px 1px, #d9d5d1 1px, transparent 1.2px) 0 0/28px 28px, var(--wash);touch-action:none}
#board.panning{cursor:grabbing}
#board.linking{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:#8a8486;stroke-width:1.6}
#links path.sel{stroke:var(--teal);stroke-width:2.6}
#links path.thread{stroke:var(--gold);stroke-dasharray:6 5;stroke-width:2.2}
#links .hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.lbl{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.lbl.sel{border-color:var(--teal);color:var(--teal)}

.card{position:absolute;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);overflow:hidden;user-select:none;cursor:default}
.card.sel{outline:3px solid var(--teal);outline-offset:1px}
.card.linksrc{outline:3px dashed var(--gold)}
.card .img{background:#1b1718;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.card .cap{padding:8px 10px 10px}
.card .cap .t{font:15px/1.3 Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .cap .m{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .kind{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.card .handle{position:absolute;right:-1px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--teal);border:3px solid #fff;cursor:crosshair;opacity:0;transition:opacity .1s}
.card:hover .handle,.card.sel .handle{opacity:1}
.card .grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;opacity:.5;background:linear-gradient(135deg,transparent 50%,#bbb 50%)}
.card.note{background:#fffbe9;border-color:#efe3b5}
.card.note .body{padding:12px 14px;font-size:15px;white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto}
.card.marker{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:0}
.card.marker .body{padding:10px 20px;font:18px/1.2 Georgia,serif;white-space:nowrap}
.card.marker .sub{font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.card.embed .frame{width:100%;height:calc(100% - 36px);background:#111}
.card.embed iframe,.card.embed img{width:100%;height:100%;border:0;object-fit:contain;display:block}
.card.embed .bar{height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);white-space:nowrap;overflow:hidden}
.card.embed .shield{position:absolute;inset:0 0 36px 0}
.card.embed.live .shield{display:none}
.card.text .body{padding:12px 14px}
.card.text .q{font:15px/1.45 Georgia,serif;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}

/* drawer + panel */
.side{position:fixed;top:56px;bottom:0;background:#fff;z-index:20;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
#drawer{left:var(--rail);width:var(--drawer);border-right:1px solid var(--rule);transform:translateX(calc(-100% - var(--rail)))}
#drawer.open{transform:none}
#panel{right:0;width:var(--panel);border-left:1px solid var(--rule);transform:translateX(100%)}
#panel.open{transform:none}
.side .hd{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.side .bd{flex:1;overflow-y:auto;padding:12px 16px 30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:3px 10px;font-size:13px;border-radius:999px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips .c{opacity:.6;margin-left:4px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.li{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;cursor:grab}
.li .img{height:120px;background:#1b1718;display:flex;align-items:center;justify-content:center}
.li .img img{max-width:100%;max-height:100%;object-fit:contain}
.li .noimg{height:120px;padding:10px;font:13px/1.35 Georgia,serif;color:var(--muted);overflow:hidden;background:var(--wash)}
.li .t{padding:6px 8px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li.on{outline:2px solid var(--teal)}
.li .k{font-size:11px;color:var(--muted);padding:0 8px 6px}
.emptybox{padding:20px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);font-size:14px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ro{font-size:13px;color:var(--muted);margin:4px 0;word-break:break-word}
.pimg{background:#1b1718;border-radius:8px;overflow:hidden;margin-bottom:10px}
.pimg img{width:100%;max-height:340px;object-fit:contain;display:block}
.conn{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.conn .lab{color:var(--muted);font-size:12px}
.conn a{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thr{border:1px solid var(--rule);border-radius:8px;padding:10px;margin:8px 0}
.thr.on{border-color:var(--gold)}
.thr ol{margin:6px 0 0 18px;padding:0;font-size:14px}
.thr li{margin:2px 0;cursor:pointer}
.ver{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}

/* present */
#present{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 8px;display:none;align-items:center;gap:8px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#present.on{display:flex}
#present button{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);border-radius:999px}
#present .where{font-size:13px;padding:0 6px;opacity:.85;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
#zoomctl{position:fixed;right:14px;bottom:14px;z-index:15;display:flex;gap:4px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:4px}
#zoomctl button{border:0;padding:4px 10px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#gate{position:fixed;inset:0;background:var(--wash);z-index:80;display:none;align-items:center;justify-content:center}
#gate .box{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:28px;max-width:520px}
#lb{position:fixed;inset:0;background:rgba(10,8,9,.92);z-index:90;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:94vw;max-height:94vh}
.modal{position:fixed;inset:0;background:rgba(20,16,17,.35);z-index:70;display:none;align-items:center;justify-content:center}
.modal .box{background:#fff;border-radius:12px;padding:20px;width:min(460px,92vw)}
</style>
</head>
<body>
<header>
  <h1>Black Aquatics</h1><span class="eyebrow">Workbench</span>
  <span class="sp"></span>
  <span class="stat" id="stat">Loading…</span>
  <button id="saveBtn" class="primary" title="Save a version of the board to the repo">Save</button>
  <a href="../" class="muted">Sorting Room</a>
</header>

<nav id="rail">
  <button data-tool="library" title="Library (L)">▦</button>
  <button data-tool="note" title="Add a note (N)">✎</button>
  <button data-tool="embed" title="Add video, GIF or link (E)">▶</button>
  <button data-tool="marker" title="Place a week marker (W)">⚑</button>
  <button data-tool="link" title="Connect two cards (C)">⤳</button>
  <button data-tool="threads" title="Threads">≋</button>
  <button data-tool="versions" title="Versions">⟲</button>
  <span style="flex:1"></span>
  <button data-tool="fit" title="See everything (F)">⤢</button>
</nav>

<div id="board"><div id="world"><svg id="links"></svg></div></div>

<aside id="drawer" class="side"></aside>
<aside id="panel" class="side"></aside>

<div id="present"><button id="pPrev">←</button><span class="where" id="pWhere"></span><button id="pNext">→</button><button id="pStop">Done</button></div>
<div id="zoomctl"><button id="zOut" title="Zoom out">−</button><button id="zPct" title="Reset to 100%">100%</button><button id="zIn" title="Zoom in">+</button></div>
<div id="toast"></div>
<div id="lb"><img alt=""></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="gate"><div class="box">
  <h2>Connect to GitHub</h2>
  <p>The workbench reads the v4 library from your private repo with the same key as the Sorting Room. Open the <a href="../">Sorting Room</a>, connect there once, then come back.</p>
</div></div>

<script>
(() => {
  // ---------- basics ----------
  const REPO_DEF = "zellaships/black-aquatics-research";
  const BOARD_PATH = "v4/boards/main.json";
  const S = { get(k, d) { try { const v = localStorage.getItem("ba." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
              set(k, v) { try { localStorage.setItem("ba." + k, JSON.stringify(v)); } catch {} } };
  const token = S.get("token", ""), repo = S.get("repo", REPO_DEF);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = p => p + "-" + Math.random().toString(36).slice(2, 9);
  const clip = (t, n) => { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
  const known = v => v && v !== "unknown" ? v : "";
  function toast(m) { const t = $("#toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2200); }
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
  async function api(path, opts = {}) {
    const r = await fetch(`https://api.github.com/repos/${repo}${path}`, { ...opts,
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
    if (!r.ok && r.status !== 404) throw new Error(`${r.status}`);
    return r;
  }
  async function raw(path, ref = "main") {
    const r = await api(`/contents/${encodeURI(path)}?ref=${ref}`, { headers: { Accept: "application/vnd.github.raw+json" } });
    return r.status === 404 ? null : r.text();
  }
  const PV = {};
  async function preview(path) {
    if (!path) return "";
    if (/^https?:/.test(path)) return path;
    if (PV[path]) return PV[path];
    PV[path] = (async () => {
      const r = await api(`/contents/${encodeURI(path)}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } });
      if (!r.ok) return "";
      return URL.createObjectURL(await r.blob());
    })();
    return PV[path];
  }
  function hydrate(root) {
    (root || document).querySelectorAll("img[data-pv]:not([src])").forEach(async img => {
      const u = await preview(img.dataset.pv); if (u) img.src = u; else img.replaceWith(Object.assign(document.createElement("span"), { className: "muted", textContent: "No preview" }));
    });
  }

  const CATS = [["image", "Images"], ["work", "Works"], ["person", "People"], ["place", "Places"], ["excerpt", "Excerpts"],
                ["event", "Events"], ["concept", "Concepts"], ["practice", "Practices"], ["nature", "Nature"]];
  const catLabel = k => (CATS.find(c => c[0] === k) || [, k])[1];

  // ---------- state ----------
  let LIB = [], LIBBY = {};                 // library index (v4/library/index.json)
  const REC = {};                           // id -> full record (loaded on demand)
  let B = { version: 1, cards: [], links: [], threads: [], updated_at: "" };
  let boardSha = null, dirty = false, lastSaved = "";
  let view = S.get("wb.view", { x: 120, y: 80, z: 0.8 });
  let sel = null;                           // {type:"card"|"link", id}
  let tool = null, linkFrom = null;
  let present = null;                       // {thread, i}
  const undoStack = [], redoStack = [];

  // ---------- load ----------
  async function load() {
    if (!token) { $("#gate").style.display = "flex"; return; }
    try {
      const ix = await raw("v4/library/index.json");
      LIB = ix ? (JSON.parse(ix).items || []) : [];
      LIBBY = {}; LIB.forEach(i => LIBBY[i.id] = i);
      const br = await api(`/contents/${BOARD_PATH}?ref=main`);
      if (br.status !== 404) { const j = await br.json(); boardSha = j.sha; B = Object.assign(B, JSON.parse(unb64(j.content))); }
      const local = S.get("wb.draft", null);
      if (local && local.updated_at > (B.updated_at || "") && local.base === boardSha) { B = local.board; dirty = true; toast("Restored your unsaved changes"); }
      lastSaved = B.updated_at || "";
      $("#stat").textContent = `${LIB.length} in the library · ${B.cards.length} on the board`;
      draw(); applyView();
      if (!B.cards.length) setTool("library");
    } catch (e) { $("#stat").textContent = `Could not load (${e.message})`; }
  }
  async function rec(id) {
    if (REC[id]) return REC[id];
    const it = LIBBY[id]; if (!it) return null;
    const t = await raw(it.path); REC[id] = t ? JSON.parse(t) : null; return REC[id];
  }

  // ---------- undo ----------
  const snap = () => JSON.stringify({ cards: B.cards, links: B.links, threads: B.threads });
  function change(fn, keepRedo) {
    undoStack.push(snap()); if (undoStack.length > 200) undoStack.shift();
    if (!keepRedo) redoStack.length = 0;
    fn(); B.updated_at = new Date().toISOString(); markDirty(); draw();
  }
  function undo() { if (!undoStack.length) return toast("Nothing to undo"); redoStack.push(snap()); Object.assign(B, JSON.parse(undoStack.pop())); markDirty(); draw(); renderPanel(); }
  function redo() { if (!redoStack.length) return; undoStack.push(snap()); Object.assign(B, JSON.parse(redoStack.pop())); markDirty(); draw(); renderPanel(); }
  function markDirty() {
    dirty = true; S.set("wb.draft", { board: B, base: boardSha, updated_at: B.updated_at });
    $("#saveBtn").textContent = "Save"; $("#saveBtn").classList.add("primary");
    $("#stat").textContent = `${LIB.length} in the library · ${B.cards.length} on the board · unsaved changes`;
  }

  // ---------- view (pan / zoom) ----------
  const board = $("#board"), world = $("#world");
  function applyView() {
    world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
    $("#zPct").textContent = Math.round(view.z * 100) + "%";
    board.style.backgroundSize = `${28 * view.z}px ${28 * view.z}px`; board.style.backgroundPosition = `${view.x}px ${view.y}px`;
    S.set("wb.view", view);
  }
  const toWorld = (cx, cy) => { const r = board.getBoundingClientRect(); return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z }; };
  function zoomAt(f, cx, cy) {
    const r = board.getBoundingClientRect(); cx = cx ?? r.left + r.width / 2; cy = cy ?? r.top + r.height / 2;
    const p = toWorld(cx, cy); view.z = Math.min(3, Math.max(0.08, view.z * f));
    view.x = cx - r.left - p.x * view.z; view.y = cy - r.top - p.y * view.z; applyView();
  }
  function centerOn(x, y, z) {
    const r = board.getBoundingClientRect(); if (z) view.z = z;
    view.x = r.width / 2 - x * view.z; view.y = r.height / 2 - y * view.z; applyView();
  }
  function fit() {
    if (!B.cards.length) return centerOn(0, 0, 1);
    const xs = B.cards.flatMap(c => [c.x, c.x + c.w]), ys = B.cards.flatMap(c => [c.y, c.y + c.h]);
    const r = board.getBoundingClientRect(), w = Math.max(...xs) - Math.min(...xs) + 200, h = Math.max(...ys) - Math.min(...ys) + 200;
    const z = Math.min(1.2, Math.max(0.08, Math.min(r.width / w, r.height / h)));
    centerOn((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, z);
  }
  board.addEventListener("wheel", e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
  }, { passive: false });
  let pan = null;
  board.addEventListener("pointerdown", e => {
    if (e.target.closest(".card,.lbl,#links .hit")) return;
    if (tool === "note" || tool === "embed" || tool === "marker") { placeAt(e); return; }
    if (tool === "link") { linkFrom = null; setTool(null); draw(); }
    select(null);
    pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; board.classList.add("panning"); board.setPointerCapture(e.pointerId);
  });
  board.addEventListener("pointermove", e => { if (!pan) return; view.x = pan.vx + e.clientX - pan.x; view.y = pan.vy + e.clientY - pan.y; applyView(); });
  board.addEventListener("pointerup", () => { pan = null; board.classList.remove("panning"); });
  $("#zIn").onclick = () => zoomAt(1.25); $("#zOut").onclick = () => zoomAt(0.8); $("#zPct").onclick = () => { view.z = 1; zoomAt(1); };

  // ---------- drawing ----------
  const KINDSIZE = { record: [260, 300], text: [280, 200], note: [240, 160], marker: [220, 60], embed: [420, 280] };
  function cardHTML(c) {
    if (c.kind === "note") return `<div class="body">${esc(c.text || "")}</div>`;
    if (c.kind === "marker") return `<div class="body"><div class="sub">${esc(c.sub || "Starting point")}</div>${esc(c.text || "Week")}</div>`;
    if (c.kind === "embed") {
      const e = embedOf(c.url);
      return `<div class="frame">${e.html}</div><div class="shield" title="Double-click to play"></div><div class="bar">${esc(e.label)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">open</a></div>`;
    }
    const it = LIBBY[c.ref] || {};
    const title = c.title || it.title || "Record not in the library";
    if (it.preview) return `<span class="kind">${esc(catLabel(it.type))}</span><div class="img" style="height:${c.h - 74}px"><img data-pv="${esc(it.preview)}" alt=""></div>
      <div class="cap"><div class="t">${esc(title)}</div><div class="m">${esc(known(it.date))}</div></div>`;
    return `<span class="kind">${esc(catLabel(it.type || ""))}</span><div class="body text" style="padding:34px 14px 12px"><div class="q">${esc(title)}</div><div class="m muted" style="margin-top:6px">${esc(known(it.date))}</div></div>`;
  }
  function embedOf(url) {
    url = String(url || "");
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
    if (m) return { html: `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`, label: "YouTube" };
    m = url.match(/vimeo\.com\/(\d+)/);
    if (m) return { html: `<iframe src="https://player.vimeo.com/video/${m[1]}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`, label: "Vimeo" };
    if (/twitch\.tv\/(\w+)/.test(url)) { const ch = url.match(/twitch\.tv\/(\w+)/)[1]; return { html: `<iframe src="https://player.twitch.tv/?channel=${ch}&parent=${location.hostname}" allowfullscreen></iframe>`, label: "Twitch live" }; }
    if (/\.(gif|png|jpe?g|webp)(\?|$)/i.test(url)) return { html: `<img src="${esc(url)}" alt="">`, label: "Image" };
    if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return { html: `<video src="${esc(url)}" controls style="width:100%;height:100%"></video>`, label: "Video" };
    return { html: `<div style="color:#ddd;padding:16px;font-size:14px">${esc(url)}</div>`, label: "Link" };
  }
  const cardById = id => B.cards.find(c => c.id === id);
  function draw() {
    world.querySelectorAll(".card,.lbl").forEach(n => { if (!B.cards.some(c => c.id === n.dataset.id) && !n.classList.contains("lbl")) n.remove(); });
    world.querySelectorAll(".lbl").forEach(n => n.remove());
    for (const c of B.cards) {
      let el = world.querySelector(`.card[data-id="${c.id}"]`);
      const sig = JSON.stringify([c.kind, c.ref, c.text, c.sub, c.url, c.title, c.h, (LIBBY[c.ref] || {}).preview]);
      if (!el) { el = document.createElement("div"); el.dataset.id = c.id; world.appendChild(el); bindCard(el); }
      if (el.dataset.sig !== sig) {
        el.dataset.sig = sig;
        el.className = "card " + (c.kind === "record" ? ((LIBBY[c.ref] || {}).preview ? "rec" : "text") : c.kind);
        el.innerHTML = cardHTML(c) + (c.kind === "marker" ? "" : `<div class="grip"></div>`) + `<div class="handle" title="Drag to another card to connect"></div>`;
        hydrate(el);
      }
      el.style.left = c.x + "px"; el.style.top = c.y + "px"; el.style.width = c.w + "px";
      if (c.kind !== "marker") el.style.height = c.h + "px";
      el.classList.toggle("sel", !!(sel && sel.type === "card" && sel.id === c.id));
      el.classList.toggle("linksrc", linkFrom === c.id);
    }
    drawLinks();
  }
  const center = c => { const el = world.querySelector(`.card[data-id="${c.id}"]`); const h = el ? el.offsetHeight : c.h; return { x: c.x + c.w / 2, y: c.y + h / 2, w: c.w, h }; };
  function edgePoint(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y; if (!dx && !dy) return a;
    const sx = (a.w / 2) / Math.abs(dx || 1e-9), sy = (a.h / 2) / Math.abs(dy || 1e-9), s = Math.min(sx, sy);
    return { x: a.x + dx * s, y: a.y + dy * s };
  }
  function drawLinks() {
    const svg = $("#links"); let h = "";
    const thr = present ? B.threads.find(t => t.id === present.thread) : (sel && sel.type === "thread" ? B.threads.find(t => t.id === sel.id) : null);
    const path = (a, b) => { const p = edgePoint(a, b), q = edgePoint(b, a); const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2; return { d: `M${p.x},${p.y} Q${mx + (q.y - p.y) * 0.08},${my - (q.x - p.x) * 0.08} ${q.x},${q.y}`, mx, my }; };
    for (const l of B.links) {
      const a = cardById(l.from), b = cardById(l.to); if (!a || !b) continue;
      const pa = center(a), pb = center(b), pp = path(pa, pb), on = sel && sel.type === "link" && sel.id === l.id;
      h += `<path class="${on ? "sel" : ""}" d="${pp.d}" marker-end="url(#arr)"/><path class="hit" data-link="${l.id}" d="${pp.d}"/>`;
      if (l.label) { const lb = document.createElement("div"); lb.className = "lbl" + (on ? " sel" : ""); lb.dataset.link = l.id; lb.textContent = l.label; lb.style.left = pp.mx + "px"; lb.style.top = pp.my + "px"; lb.onpointerdown = e => { e.stopPropagation(); select({ type: "link", id: l.id }); }; world.appendChild(lb); }
    }
    if (thr) for (let i = 0; i + 1 < thr.steps.length; i++) {
      const a = cardById(thr.steps[i]), b = cardById(thr.steps[i + 1]); if (!a || !b) continue;
      h += `<path class="thread" d="${path(center(a), center(b)).d}"/>`;
    }
    svg.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8486"/></marker></defs>` + h;
    svg.querySelectorAll(".hit").forEach(p => p.onpointerdown = e => { e.stopPropagation(); select({ type: "link", id: p.dataset.link }); });
  }

  // ---------- card interaction ----------
  function bindCard(el) {
    el.addEventListener("pointerdown", e => {
      const id = el.dataset.id, c = cardById(id); if (!c) return;
      e.stopPropagation();
      if (e.target.classList.contains("handle")) return startLinkDrag(e, c);
      if (tool === "link") { linkClick(c); return; }
      if (e.target.closest("a,iframe,video")) return;
      select({ type: "card", id });
      const grip = e.target.classList.contains("grip");
      const start = { x: e.clientX, y: e.clientY, cx: c.x, cy: c.y, w: c.w, h: c.h }; let moved = false, before = null;
      el.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = (ev.clientX - start.x) / view.z, dy = (ev.clientY - start.y) / view.z;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
        if (!moved) { moved = true; before = snap(); }
        if (grip) { c.w = Math.max(140, start.w + dx); c.h = Math.max(80, start.h + dy); }
        else { c.x = Math.round(start.cx + dx); c.y = Math.round(start.cy + dy); }
        draw();
      };
      const up = () => {
        el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up);
        if (moved) { undoStack.push(before); redoStack.length = 0; B.updated_at = new Date().toISOString(); markDirty(); }
      };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
    });
    el.addEventListener("dblclick", e => {
      const c = cardById(el.dataset.id); if (!c) return;
      if (c.kind === "embed") { el.classList.toggle("live"); return; }
      if (c.kind === "note" || c.kind === "marker") return editText(c);
      if (c.kind === "record") { const it = LIBBY[c.ref]; if (it && it.preview) preview(it.preview).then(u => { if (u) { $("#lb img").src = u; $("#lb").style.display = "flex"; } }); }
    });
  }
  $("#lb").onclick = () => $("#lb").style.display = "none";
  function startLinkDrag(e, c) {
    const tmp = document.createElementNS("http://www.w3.org/2000/svg", "path"); tmp.setAttribute("class", "sel"); $("#links").appendChild(tmp);
    const a = center(c);
    const mv = ev => { const p = toWorld(ev.clientX, ev.clientY); tmp.setAttribute("d", `M${a.x},${a.y} L${p.x},${p.y}`); };
    const up = ev => {
      document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); tmp.remove();
      const t = document.elementFromPoint(ev.clientX, ev.clientY); const target = t && t.closest(".card");
      if (target && target.dataset.id !== c.id) addLink(c.id, target.dataset.id);
    };
    document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
  }
  function linkClick(c) {

  }
  function addLink(from, to) {
    if (B.links.some(l => l.from === from && l.to === to)) { toast("Already connected"); return; }
    const id = uid("l"); change(() => B.links.push({ id, from, to, label: "" }));
    select({ type: "link", id }); setTimeout(() => { const i = $("#panel [data-f=label]"); if (i) i.focus(); }, 50);
  }
  function editText(c) {
    modal(`<h2>${c.kind === "marker" ? "Week marker" : "Note"}</h2>
      ${c.kind === "marker" ? `<div class="field"><label>Small line above</label><input type="text" id="m-sub" value="${esc(c.sub || "Starting point")}"></div>` : ""}
      <div class="field"><label>${c.kind === "marker" ? "Marker" : "Note"}</label><textarea id="m-text">${esc(c.text || "")}</textarea></div>
      <div class="row"><button class="primary" id="m-ok">Done</button><button id="m-cancel">Cancel</button></div>`, () => {
      const t = $("#m-text").value, s = $("#m-sub") ? $("#m-sub").value : undefined;

  }

  // ---------- placing things ----------
  function placeAt(e) {
    const p = toWorld(e.clientX, e.clientY), k = tool;
    if (k === "note") { const c = { id: uid("c"), kind: "note", x: Math.round(p.x), y: Math.round(p.y), w: 240, h: 160, text: "" }; change(() => B.cards.push(c)); setTool(null); editText(c); }
    if (k === "marker") { const c = { id: uid("c"), kind: "marker", x: Math.round(p.x), y: Math.round(p.y), w: 220, h: 60, text: `Week ${B.cards.filter(x => x.kind === "marker").length + 1}`, sub: "Starting point" }; change(() => B.cards.push(c)); setTool(null); editText(c); }
    if (k === "embed") {
      setTool(null);
      modal(`<h2>Add video, GIF or link</h2><p class="muted">YouTube, Vimeo, a Twitch channel (live), an image or GIF link, a video file link, or any web link.</p>

  function addRecord(id, at) {

  board.addEventListener("dragover", e => e.preventDefault());

  // ---------- selection + side panel ----------
  function select(s) { sel = s; draw(); renderPanel(); }
  async function renderPanel() {
    const p = $("#panel");

    if (sel.type === "link") {
      const l = B.links.find(x => x.id === sel.id); if (!l) return select(null);
      const a = cardById(l.from), b = cardById(l.to);
      p.innerHTML = `<div class="hd"><div class="eyebrow">Connection</div><h2>${esc(cardTitle(a))} → ${esc(cardTitle(b))}</h2></div>
        <div class="bd"><div class="field"><label>What connects them?</label><input type="text" data-f="label" value="${esc(l.label || "")}" placeholder="e.g. same river, answers, echoes, contradicts"></div>
        <div class="row"><button id="lSwap">Flip direction</button><button id="lDel">Remove connection</button></div></div>`;
      const inp = p.querySelector("[data-f=label]"); let t = null;

      : `<div class="ro">No connections yet. Drag from the green dot on the card's edge to another card.</div>`;
    const threadsIn = B.threads.filter(t => t.steps.includes(c.id));
    const actions = `<div class="row" style="margin-top:12px"><button id="cThread">Add to thread</button><button id="cDel">Remove from board</button></div>`;
    if (c.kind !== "record") {
      p.innerHTML = `<div class="hd"><div class="eyebrow">${c.kind === "marker" ? "Week marker" : c.kind === "embed" ? "Embed" : "Note"}</div><h2>${esc(cardTitle(c))}</h2></div>
        <div class="bd">${c.kind === "embed" ? `<div class="field"><label>Link</label><input type="url" data-f="url" value="${esc(c.url)}"></div><p class="muted">Double-click the card to play it; double-click again to move it.</p>` : `<button id="cEdit">Edit text</button>`}

    } else {

      body.innerHTML = `${it.preview ? `<div class="pimg"><img data-pv="${esc(it.preview)}" alt=""></div>` : ""}
        ${r ? `${r.summary ? `<p>${esc(r.summary)}</p>` : ""}${r.quote ? `<blockquote style="font:15px/1.5 Georgia,serif;margin:8px 0;border-left:3px solid var(--rule);padding-left:12px">${esc(r.quote)}</blockquote>` : ""}
        ${row("Date", r.date && r.date.as_stated)}${row("Creator", r.creator_as_stated)}${row("Held by", r.holder)}

        ${(r.questions || []).length ? `<h3 class="eyebrow" style="margin-top:16px">Open questions</h3>${r.questions.map(q => `<div class="ro">${esc(q.q)}${q.answer ? ` <br><span style="color:var(--teal)">${esc(q.answer)}</span>` : ""}</div>`).join("")}` : ""}` : `<div class="muted">This record is not in the library any more.</div>`}
        ${actions}<h3 class="eyebrow" style="margin-top:20px">Connections</h3>${connHTML}

  function cardTitle(c) {

  // ---------- library drawer ----------

  // ---------- threads ----------
  function addToThread(cardId) {
    const opts = B.threads.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    modal(`<h2>Add to a thread</h2><p class="muted">A thread is an ordered path through the board, for walking a session from card to card.</p>
      ${B.threads.length ? `<div class="field"><label>Thread</label><select id="m-thr">${opts}<option value="__new">New thread…</option></select></div>` : ""}
      <div class="field" id="m-newwrap" style="${B.threads.length ? "display:none" : ""}"><label>New thread name</label><input type="text" id="m-new" placeholder="e.g. Week 1: Kalunga line"></div>
      <div class="row"><button class="primary" id="m-ok">Add</button><button id="m-cancel">Cancel</button></div>`, () => {
      let tid = $("#m-thr") ? $("#m-thr").value : "__new";

  function renderThreads() {

    p.innerHTML = `<div class="hd"><div class="eyebrow">Threads</div><h2>Paths through the board</h2>

      <div class="bd">${B.threads.length ? B.threads.map(t => `<div class="thr ${sel && sel.type === "thread" && sel.id === t.id ? "on" : ""}" data-t="${t.id}">
        <div class="row" style="justify-content:space-between"><b>${esc(t.name)}</b><span class="muted">${t.steps.length} stops</span></div>
        <ol>${t.steps.map((s, i) => `<li data-step="${i}">${esc(cardTitle(cardById(s)))} <button class="ghost" data-up="${i}" title="Move up">↑</button><button class="ghost" data-rm="${i}" title="Remove">✕</button></li>`).join("")}</ol>
        <div class="row" style="margin-top:8px"><button class="primary" data-present="${t.id}" ${t.steps.length ? "" : "disabled"}>Present</button><button data-show="${t.id}">Show path</button><button data-ren="${t.id}">Rename</button><button data-del="${t.id}">Delete</button></div></div>`).join("")
        : `<div class="emptybox">No threads yet.</div>`}</div>`;
    const T = id => B.threads.find(t => t.id === id);
    p.querySelectorAll(".thr").forEach(box => {
      const t = T(box.dataset.t);
      box.querySelectorAll("[data-step]").forEach(li => li.onclick = e => { if (e.target.closest("button")) return; const c = cardById(t.steps[+li.dataset.step]); if (c) { centerOn(c.x + c.w / 2, c.y + c.h / 2); } });
      box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) change(() => { [t.steps[i - 1], t.steps[i]] = [t.steps[i], t.steps[i - 1]]; }); renderThreads(); });
      box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { change(() => t.steps.splice(+b.dataset.rm, 1)); renderThreads(); });
    });
    p.querySelectorAll("[data-present]").forEach(b => b.onclick = () => startPresent(b.dataset.present));
    p.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { sel = { type: "thread", id: b.dataset.show }; draw(); renderThreads(); });
    p.querySelectorAll("[data-ren]").forEach(b => b.onclick = () => { const t = T(b.dataset.ren); modal(`<h2>Rename thread</h2><input type="text" id="m-new" value="${esc(t.name)}"><div class="row" style="margin-top:10px"><button class="primary" id="m-ok">Save</button><button id="m-cancel">Cancel</button></div>`, () => { change(() => t.name = $("#m-new").value.trim() || t.name); renderThreads(); }); });
    p.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (!confirm("Delete this thread? The cards stay on the board.")) return; change(() => B.threads = B.threads.filter(t => t.id !== b.dataset.del)); renderThreads(); });
  }
  function startPresent(tid) { present = { thread: tid, i: 0 }; $("#present").classList.add("on"); $("#panel").classList.remove("open"); setTool(null); step(0); }
  function step(d) {
    const t = B.threads.find(x => x.id === present.thread); if (!t || !t.steps.length) return stopPresent();
    present.i = Math.max(0, Math.min(t.steps.length - 1, present.i + d));
    const c = cardById(t.steps[present.i]); if (!c) return;
    const r = board.getBoundingClientRect(), z = Math.min(1.6, Math.max(0.4, Math.min(r.width * 0.55 / c.w, r.height * 0.7 / c.h)));
    world.style.transition = "transform .45s ease"; centerOn(c.x + c.w / 2, c.y + c.h / 2, z); setTimeout(() => world.style.transition = "", 480);
    sel = { type: "card", id: c.id }; draw();
    $("#pWhere").textContent = `${t.name} · ${present.i + 1} of ${t.steps.length} · ${cardTitle(c)}`;
  }
  function stopPresent() { present = null; $("#present").classList.remove("on"); draw(); }
  $("#pPrev").onclick = () => step(-1); $("#pNext").onclick = () => step(1); $("#pStop").onclick = stopPresent;

  // ---------- save + versions ----------
  async function saveBoard(message) {
    $("#saveBtn").textContent = "Saving…";
    try {
      B.updated_at = B.updated_at || new Date().toISOString();
      for (let i = 0; i < 2; i++) {
        const body = { message: message || `Board: ${B.cards.length} cards, ${B.links.length} connections`, content: b64(JSON.stringify(B, null, 1) + "\n"), branch: "main" };
        if (boardSha) body.sha = boardSha;
        const r = await api(`/contents/${BOARD_PATH}`, { method: "PUT", body: JSON.stringify(body) });
        if (r.ok) { boardSha = (await r.json()).content.sha; dirty = false; S.set("wb.draft", null); lastSaved = B.updated_at;
          $("#saveBtn").textContent = "Saved"; $("#saveBtn").classList.remove("primary");
          $("#stat").textContent = `${LIB.length} in the library · ${B.cards.length} on the board · saved ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`; return true; }
        if (r.status === 409 || r.status === 422) {
          // someone else saved: keep both by taking their cards we do not have
          const cur = await api(`/contents/${BOARD_PATH}?ref=main`); const j = await cur.json(); boardSha = j.sha;
          const theirs = JSON.parse(unb64(j.content)); const mine = new Set(B.cards.map(c => c.id)), ml = new Set(B.links.map(l => l.id));
          theirs.cards.forEach(c => { if (!mine.has(c.id)) B.cards.push(c); }); theirs.links.forEach(l => { if (!ml.has(l.id)) B.links.push(l); });
          toast("Merged with a newer save"); draw(); continue;
        }
        throw new Error(r.status);
      }
    } catch (e) { $("#saveBtn").textContent = "Save"; toast(`Could not save (${e.message}). Your changes are kept in this browser.`); }
    return false;
  }
  $("#saveBtn").onclick = () => saveBoard();
  setInterval(() => { if (dirty && token) saveBoard("Board autosave"); }, 120000);
  async function renderVersions() {
    const p = $("#panel"); p.classList.add("open"); sel = null; draw();
    p.innerHTML = `<div class="hd"><div class="eyebrow">Versions</div><h2>Saved boards</h2><p class="muted" style="margin:0">Every save is kept in the repo. Restoring loads that version; save to keep it.</p></div><div class="bd" id="vbody"><div class="muted">Loading…</div></div>`;
    try {
      const list = await (await api(`/commits?path=${BOARD_PATH}&per_page=40`)).json();
      $("#vbody").innerHTML = (Array.isArray(list) && list.length) ? list.map(c => `<div class="ver"><div>${esc(c.commit.message)}</div>
        <div class="row" style="justify-content:space-between"><span class="muted">${new Date(c.commit.author.date).toLocaleString()}</span><button data-v="${c.sha}">Restore</button></div></div>`).join("")
        : `<div class="emptybox">No saved versions yet. Press Save at the top.</div>`;
      $("#vbody").querySelectorAll("[data-v]").forEach(b => b.onclick = async () => {
        const t = await raw(BOARD_PATH, b.dataset.v); if (!t) return;
        change(() => { const old = JSON.parse(t); B.cards = old.cards || []; B.links = old.links || []; B.threads = old.threads || []; });
        world.querySelectorAll(".card").forEach(n => n.remove()); draw(); fit(); toast("Version restored. Save to keep it.");
      });
    } catch (e) { $("#vbody").innerHTML = `<div class="muted">Could not load versions (${e.message}).</div>`; }
  }

  // ---------- tools ----------
  function setTool(t) {
    tool = t === tool ? null : t;
    document.querySelectorAll("#rail [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === tool || (b.dataset.tool === "library" && $("#drawer").classList.contains("open"))));
    board.classList.toggle("linking", tool === "link");
    if (tool === "library") { const d = $("#drawer"); d.classList.toggle("open"); tool = null; if (d.classList.contains("open")) renderLibrary(); setTool(tool); return; }
    if (tool === "threads") { tool = null; sel = null; renderThreads(); setTool(null); return; }
    if (tool === "versions") { tool = null; renderVersions(); setTool(null); return; }
    if (tool === "fit") { tool = null; fit(); setTool(null); return; }
    if (tool === "note" || tool === "embed" || tool === "marker") toast("Click on the board to place it");
    if (tool === "link") toast("Click a card, then the card to connect it to");
  }
  document.querySelectorAll("#rail [data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
  function modal(html, ok) {
    $("#mbox").innerHTML = html; $("#modal").style.display = "flex";
    const close = () => $("#modal").style.display = "none";
    $("#m-ok").onclick = () => { close(); ok(); };
    $("#m-cancel").onclick = close;
    const f = $("#mbox").querySelector("textarea,input"); if (f) { f.focus(); f.select && f.select(); }
  }
  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $("#modal").style.display === "flex") {
      if (e.key === "Escape") $("#modal").style.display = "none";
      return;
    }
    const k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.metaKey || e.ctrlKey) && k === "s") { e.preventDefault(); saveBoard(); return; }
    if (present) { if (k === "arrowright" || k === " ") step(1); else if (k === "arrowleft") step(-1); else if (k === "escape") stopPresent(); return; }
    if (k === "escape") { setTool(null); linkFrom = null; select(null); $("#lb").style.display = "none"; }
    else if ((k === "backspace" || k === "delete") && sel) {
      if (sel.type === "card") removeCard(sel.id);
      else if (sel.type === "link") { change(() => B.links = B.links.filter(l => l.id !== sel.id)); select(null); }
    }
    else if (k === "l") setTool("library"); else if (k === "n") setTool("note"); else if (k === "e") setTool("embed");
    else if (k === "w") setTool("marker"); else if (k === "c") setTool("link"); else if (k === "f") fit();
  });
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  load();
})();
</script>
</body>
</html>
